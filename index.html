<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestión Cuadrantes">
<meta name="theme-color" content="#0f172a">
<title>Gestión Cuadrantes 🧹</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f0f2f7; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0f172a; overflow: hidden; height: 100dvh; }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 100%; margin: 0 auto; background: #f0f2f7; }
  
  #header { background: #0f172a; color: #fff; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header h1 { font-size: 20px; font-weight: 800; }
  #header p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  
  #content { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  
  #nav { display: flex; background: #fff; border-top: 1.5px solid #e2e8f0; flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #nav button { flex: 1; background: none; border: none; padding: 11px 0 6px; cursor: pointer; color: #94a3b8; border-top: 2.5px solid transparent; font-weight: 600; }
  #nav button.active { color: #0f172a; border-top-color: #0f172a; }
  #nav button .nav-icon { font-size: 22px; display: block; }
  #nav button .nav-label { font-size: 10px; margin-top: 2px; }
  
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .card-header { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
  .card-body { padding: 14px 16px; }
  
  .wrap { overflow-x: auto; padding: 1rem 0; }
  table { border-collapse: collapse; font-size: 11px; min-width: 900px; width: 100%; }
  th, td { border: 0.5px solid #cbd5e1; text-align: center; padding: 4px 2px; min-width: 28px; }
  th { background: #f1f5f9; font-weight: 600; font-size: 10px; position: sticky; top: 0; }
  th.name, td.name { text-align: left; padding-left: 8px; min-width: 180px; position: sticky; left: 0; background: #fff; z-index: 1; }
  tr:nth-child(even) td { background: #f8fafc; }
  .L { color: #185FA5; font-weight: 600; }
  .D { color: #3B6D11; font-weight: 600; }
  .F1 { color: #A32D2D; font-weight: 600; }
  .N { color: #854F0B; font-weight: 600; }
  .wkend { background: #eef2ff !important; }
  .editable-cell { cursor: pointer; transition: background 0.1s; }
  .editable-cell:active { background: #dbeafe; }
  .baja-row { opacity: 0.6; background: #fee2e2 !important; }
  
  .worker-list { display: flex; flex-direction: column; gap: 8px; }
  .worker-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; cursor: pointer; transition: background 0.1s; }
  .worker-name { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge-baja { background: #dc2626; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; }
  .badge-sustituto { background: #d97706; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; }
  .worker-summary { font-size: 11px; color: #64748b; margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
  
  .btn-primary { background: #0f172a; color: #fff; border: none; border-radius: 12px; padding: 12px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 10px; }
  .btn-secondary { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; cursor: pointer; font-weight: 500; width: 100%; margin-bottom: 8px; }
  
  .aviso { background: #fef3c7; border-left: 4px solid #d97706; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 12px; }
  .aviso-rojo { background: #fee2e2; border-left-color: #dc2626; }
  
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: #fff; border-radius: 20px; padding: 20px; width: 90%; max-width: 340px; max-height: 80vh; overflow-y: auto; }
  .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
  .modal-buttons button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
  
  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 12px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  
  .import-input { display: none; }
  .month-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .month-btn { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .month-btn.active { background: #0f172a; color: white; border-color: #0f172a; }
</style>
</head>
<body>
<div id="app">
  <div id="header"><div><h1>🧹 Gestión Cuadrantes</h1><p id="header-sub"></p></div></div>
  <div id="content"></div>
  <nav id="nav">
    <button class="active" onclick="showView('home')" id="nav-home"><span class="nav-icon">🏠</span><span class="nav-label">Inicio</span></button>
    <button onclick="showView('cuadrante')" id="nav-cuadrante"><span class="nav-icon">📅</span><span class="nav-label">Cuadrante</span></button>
    <button onclick="showView('trabajadores')" id="nav-trabajadores"><span class="nav-icon">👥</span><span class="nav-label">Personal</span></button>
    <button onclick="showView('seguro')" id="nav-seguro"><span class="nav-icon">🔒</span><span class="nav-label">Seguro</span></button>
  </nav>
</div>
<div id="toast"></div>
<input type="file" id="import-file" class="import-input" accept=".json" onchange="handleImport(event)">

<script>
// ==================== CONFIGURACIÓN HORAS ====================
const HORAS_POR_CODIGO = {
  "L": 0, "D": 0, "": 0,
  "F1": 7, "N": 10, "M": 7, "T": 7,
  "U": 0, "G": 0, "H": 0
};
for (let i = 2; i <= 9; i++) HORAS_POR_CODIGO[i.toString()] = i;

// ==================== MESES Y CUADRANTES ====================
const MESES = [
  { nombre: "Enero", dias: 31 },
  { nombre: "Febrero", dias: 28 },
  { nombre: "Marzo", dias: 31 },
  { nombre: "Abril", dias: 30 },
  { nombre: "Mayo", dias: 31 },
  { nombre: "Junio", dias: 30 }
];
let mesActual = 5; // Junio
let diasDelMesActual = 30;

// Días con fondo especial (fines de semana según el ejemplo)
function isWeekend(dia) {
  // Basado en el ejemplo: días 1,7,8,14,15,21,22,28,29
  return [1,7,8,14,15,21,22,28,29].includes(dia);
}

// Plantilla original del cuadrante (27 filas, 31 columnas)
const PLANTILLA_CUADRANTE = [
  ["L","L","L","L","","L","L","L","","","L","L","","L","L","","L","","L","L","","L","L","","L","L","","L","L","",""],
  ["L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L"],
  ["","","","","","L","L","L","","","","","","","","","","","L","L","","","","","","","","L","L","",""],
  ["","","","","","L","L","","","","","","L","L","","","","","L","L","","","","","","","","L","L","",""],
  ["F1","F1","","F1","","L","L","","F1","F1","","F1","F1","","","","F1","F1","","L","L","","","","F1","F1","","F1","F1","",""],
  ["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],
  ["L","L","L","L","","L","L","L","L","L","L","L","","L","L","","L","L","L","L","","L","L","","L","L","","L","L","","L"],
  ["","","","","","","","D","","","","","","","","D","","","","","","","","D","","","","","","D",""],
  ["L","L","","L","","L","L","L","L","","L","L","","L","","L","L","","L","L","","L","L","","L","L","","L","L","",""],
  ["D","D","","D","","D","D","D","","","D","D","","D","D","","D","D","","D","D","","D","D","","D","D","","D","D",""],
  ["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],
  ["","9","","","5","L","L","9","9","5","","8","9","9","5","","","9","9","4","L","L","","9","5","","8","9","","","5"],
  ["","","","4","","L","L","","","4","","","","4","8","8","4","","","","L","L","","","4","8","8","","","","4"],
  ["F1","F1","H","F1","F1","L","L","F1","F1","","","F1","","F1","F1","F1","F1","F1","","F1","L","L","F1","F1","F1","F1","F1","F1","F1","F1",""],
  ["D","D","D","D","","D","D","D","D","","D","D","","D","D","","D","D","","D","D","","D","D","","D","D","","D","D",""],
  ["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],
  ["F1","F1","","F1","","L","L","F1","F1","","F1","F1","F1","F1","","F1","F1","","F1","F1","","L","L","F1","F1","","F1","F1","","F1",""],
  ["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],
  ["L","","L","","L","L","L","","L","L","","L","L","","L","L","","L","L","","L","L","","L","L","","L","L","","L",""],
  ["F1","F1","","","L","L","L","","","","","L","","","L","","","","","L","L","L","","G","G","G","G","G","","",""],
  ["F1","F1","","","","L","L","","","","D","","","","","","","","","","L","L","","","","","","","","",""],
  ["","2","6","6","2","L","L","2","2","","","","2","2","","","2","6","6","2","L","L","2","","","6","6","2","","",""],
  ["L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L","L"],
  ["","L","L","M","","L","L","L","L","M","","","L","L","M","","L","L","L","L","","L","L","","L","L","M","L","","","M"],
  ["U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U","U"],
  ["L","N","L","L","","L","L","L","","L","L","L","L","L","L","L","L","L","L","L","","L","L","L","L","L","L","L","L","L",""],
  ["L","L","M","N","","L","L","L","M","N","","L","L","M","N","","L","M","N","N","","L","L","M","N","","L","L","M","N",""]
];

const NOMBRES_BASE = [
  "MARIA JOSE GARCIA LATORRE", "ANA BELEN SERRANO MOTA", "VICTORIA CHAVES ARIAS",
  "Mª JESUS SALO LONGARES", "CONCEPCION GARCIA GUERRERO", "CONCEPCION TARBUENCA SILVESTRE",
  "ASUNCION IBARRA ARAMBURO", "LUCIA MORENO APARICIO", "Mª JESUS BETRIAN MORA",
  "BELINDA MARUGAN RIBAS", "MARI CARMEN CHUECA GRACIA", "Rosario Polo",
  "Candela Ruiz / Pared", "JOSE LUIS GARCIA SANCHO", "JOE GARCIA OLIVAR",
  "SERRANO GONZALEZ", "IVAR PEREZ", "SERRANO", "IRIN MUNUERA",
  "LANDA LORENTE BENITO", "SUSANA NAVARRO MARQUINA", "PEÑA DURAN PEREZ",
  "Mª JESUS BOILLOS CASADO", "VANESSA BETRIAN MORA", "Mª ISABEL IBARRA ARAMBURO",
  "JOSE RAMON RUIZ CHAVES", "A. Contra Joyce"
];

// ==================== ESTADO GLOBAL ====================
let trabajadores = [];
let cuadrante = [];
let currentView = "home";

// ==================== FUNCIONES AUXILIARES ====================
function getHorasTurno(codigo) {
  if (codigo === undefined || codigo === null || codigo === "") return 0;
  const num = parseInt(codigo);
  if (!isNaN(num) && num >= 2 && num <= 9) return num;
  return HORAS_POR_CODIGO[codigo] || 0;
}

function getMaxDiasSeguidos(idx, hastaDia = diasDelMesActual - 1) {
  const fila = cuadrante[idx] || [];
  let maxSeguidos = 0;
  let actual = 0;
  for (let i = 0; i <= hastaDia; i++) {
    const val = fila[i];
    const tieneTurno = val && val !== "L" && val !== "D" && val !== "";
    if (tieneTurno) {
      actual++;
      maxSeguidos = Math.max(maxSeguidos, actual);
    } else actual = 0;
  }
  return maxSeguidos;
}

// ==================== INICIALIZACIÓN ====================
function inicializarTrabajadores() {
  trabajadores = NOMBRES_BASE.map((nombre, idx) => ({
    id: idx,
    nombre: nombre,
    estado: "activo",
    fechaInicioBaja: null,
    fechaFinBaja: null,
    cubreA: null,
    notas: ""
  }));
}

function inicializarCuadrante() {
  // Copiar la plantilla exactamente
  cuadrante = JSON.parse(JSON.stringify(PLANTILLA_CUADRANTE));
  
  // Ajustar al número de días del mes actual
  cuadrante = cuadrante.map(fila => {
    const nuevaFila = [];
    for (let i = 0; i < diasDelMesActual; i++) {
      nuevaFila[i] = (fila[i] !== undefined) ? fila[i] : "";
    }
    return nuevaFila;
  });
}

function cargarDatos() {
  const guardado = localStorage.getItem("cuadrante_laboral_v4");
  if (guardado) {
    try {
      const data = JSON.parse(guardado);
      trabajadores = data.trabajadores || [];
      cuadrante = data.cuadrante || [];
      mesActual = data.mesActual !== undefined ? data.mesActual : 5;
      diasDelMesActual = MESES[mesActual].dias;
    } catch(e) { console.error(e); }
  }
  if (!trabajadores.length) inicializarTrabajadores();
  if (!cuadrante.length) inicializarCuadrante();
}

function guardarDatos() {
  const data = { trabajadores, cuadrante, mesActual };
  localStorage.setItem("cuadrante_laboral_v4", JSON.stringify(data));
}

// ==================== RENDERIZADO ====================
function renderizarCuadrante() {
  // Selector de meses
  let html = `<div class="month-selector">`;
  MESES.forEach((mes, idx) => {
    html += `<button class="month-btn ${idx === mesActual ? 'active' : ''}" onclick="cambiarMes(${idx})">${mes.nombre}</button>`;
  });
  html += `<button class="month-btn" onclick="importarNuevoCuadrante()">📂 Importar</button>`;
  html += `</div>`;
  
  html += `<div class="aviso">📌 Toca cualquier celda para editarla. Los cambios se guardan automáticamente.</div>`;
  html += `<div class="wrap">`
  html += `<table><thead><tr><th class="name">Nombre</th>`;
  
  for (let d = 1; d <= diasDelMesActual; d++) {
    html += `<th class="${isWeekend(d) ? 'wkend' : ''}">${d}</th>`;
  }
  html += `</tr></thead><tbody>`;
  
  for (let i = 0; i < trabajadores.length; i++) {
    const trab = trabajadores[i];
    const isBaja = trab.estado === "baja";
    html += `<tr class="${isBaja ? 'baja-row' : ''}">`;
    html += `<td class="name">${trab.nombre} ${getEstadoBadge(trab)}</td>`;
    
    for (let d = 0; d < diasDelMesActual; d++) {
      const val = (cuadrante[i] && cuadrante[i][d] !== undefined) ? cuadrante[i][d] : "";
      let colorClass = "";
      if (val === "L") colorClass = "L";
      else if (val === "D") colorClass = "D";
      else if (val === "F1") colorClass = "F1";
      else if (val === "N") colorClass = "N";
      const wkendClass = isWeekend(d + 1) ? "wkend" : "";
      html += `<td class="editable-cell ${colorClass} ${wkendClass}" onclick="editarCelda(${i},${d},'${val.replace(/'/g, "\\'")}')">${val}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  
  document.getElementById("content").innerHTML = html;
  document.getElementById("header-sub").textContent = `${MESES[mesActual].nombre} ${new Date().getFullYear()}`;
}

function getEstadoBadge(trab) {
  if (trab.estado === "baja") return `<span class="badge-baja">🔴 BAJA</span>`;
  if (trab.estado === "sustituto") return `<span class="badge-sustituto">🟡 SUSTITUTO</span>`;
  return "";
}

function editarCelda(fila, col, valorActual) {
  const nuevoValor = prompt(`Editar celda (${trabajadores[fila].nombre}, día ${col + 1})`, valorActual);
  if (nuevoValor !== null) {
    if (!cuadrante[fila]) cuadrante[fila] = [];
    cuadrante[fila][col] = nuevoValor;
    guardarDatos();
    mostrarToast(`✅ Cambiado a "${nuevoValor}"`);
    renderizarCuadrante();
  }
}

function cambiarMes(idx) {
  mesActual = idx;
  diasDelMesActual = MESES[idx].dias;
  inicializarCuadrante();
  guardarDatos();
  renderizarCuadrante();
  mostrarToast(`📅 Cambiado a ${MESES[idx].nombre}`);
}

function importarNuevoCuadrante() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data) && data.length === trabajadores.length) {
          cuadrante = data;
          guardarDatos();
          mostrarToast("✅ Cuadrante importado correctamente");
          renderizarCuadrante();
        } else {
          mostrarToast("❌ Formato inválido: debe ser una matriz con el mismo número de trabajadores", true);
        }
      } catch(err) {
        mostrarToast("❌ Archivo no válido", true);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function renderHome() {
  let alertasHtml = `<div class="card"><div class="card-header">⚠️ Alertas</div><div class="card-body">`;
  let hayAlertas = false;
  
  // Trabajadores con más de 6 días seguidos
  for (let i = 0; i < trabajadores.length; i++) {
    const seguidos = getMaxDiasSeguidos(i);
    if (seguidos > 6 && trabajadores[i].estado === "activo") {
      alertasHtml += `<div class="aviso aviso-rojo">⚠️ ${trabajadores[i].nombre} lleva ${seguidos} días seguidos trabajando</div>`;
      hayAlertas = true;
    }
  }
  
  // Bajas próximas
  for (const trab of trabajadores) {
    if (trab.fechaFinBaja) {
      const fechaFin = new Date(trab.fechaFinBaja);
      const hoy = new Date();
      const diff = Math.ceil((fechaFin - hoy) / (1000 * 60 * 60 * 24));
      if (diff <= 7 && diff >= 0) {
        alertasHtml += `<div class="aviso aviso-rojo">⚠️ ${trab.nombre} (${trab.estado}) finaliza el ${trab.fechaFinBaja}</div>`;
        hayAlertas = true;
      }
    }
  }
  
  if (!hayAlertas) alertasHtml += `<p style="color:#64748b;">No hay alertas pendientes</p>`;
  alertasHtml += `</div></div>`;
  
  document.getElementById("content").innerHTML = alertasHtml;
  document.getElementById("header-sub").textContent = `${MESES[mesActual].nombre} ${new Date().getFullYear()}`;
}

function renderTrabajadores() {
  let html = `<div class="worker-list">`;
  for (const trab of trabajadores) {
    // Calcular horas totales del mes
    let totalHoras = 0;
    const fila = cuadrante[trab.id] || [];
    for (let i = 0; i < diasDelMesActual; i++) {
      totalHoras += getHorasTurno(fila[i]);
    }
    
    html += `<div class="worker-item" onclick="verDetalleTrabajador(${trab.id})">
      <div class="worker-name">${trab.nombre} ${getEstadoBadge(trab)}</div>
      <div class="worker-summary">
        <span>📊 ${totalHoras} horas mes</span>
        <span>📆 Máx seguidos: ${getMaxDiasSeguidos(trab.id)} días</span>
      </div>
      ${trab.estado === "activo" ? `<button class="btn-secondary" style="margin-top:8px;" onclick="event.stopPropagation();iniciarBaja(${trab.id})">🔴 Marcar baja</button>` : ""}
    </div>`;
  }
  html += `<button class="btn-primary" onclick="añadirTrabajador()">➕ Añadir trabajador</button></div>`;
  document.getElementById("content").innerHTML = html;
}

function añadirTrabajador() {
  const nombre = prompt("Nombre del nuevo trabajador:");
  if (!nombre) return;
  const nuevoId = trabajadores.length;
  trabajadores.push({
    id: nuevoId,
    nombre: nombre,
    estado: "activo",
    fechaInicioBaja: null,
    fechaFinBaja: null,
    cubreA: null,
    notas: ""
  });
  const nuevaFila = Array(diasDelMesActual).fill("");
  cuadrante.push(nuevaFila);
  guardarDatos();
  renderTrabajadores();
  mostrarToast(`✅ "${nombre}" añadido`);
}

function verDetalleTrabajador(id) {
  const t = trabajadores.find(t => t.id === id);
  if (!t) return;
  let totalHoras = 0;
  const fila = cuadrante[id] || [];
  for (let i = 0; i < diasDelMesActual; i++) {
    totalHoras += getHorasTurno(fila[i]);
  }
  alert(`${t.nombre}\n\n📊 Horas este mes: ${totalHoras}\n📆 Máximo días seguidos: ${getMaxDiasSeguidos(id)}\n📌 Estado: ${t.estado}${t.fechaInicioBaja ? `\n📅 Baja desde día ${t.fechaInicioBaja}` : ""}${t.cubreA ? `\n👥 Sustituye a: ${trabajadores.find(t2 => t2.id === t.cubreA)?.nombre}` : ""}`);
}

function iniciarBaja(idTrabajador) {
  const trabajador = trabajadores.find(t => t.id === idTrabajador);
  if (!trabajador) return;
  
  const fechaInicio = prompt("📅 Fecha de inicio de la baja (día del mes, 1-31):", "");
  if (!fechaInicio) return;
  const diaInicio = parseInt(fechaInicio);
  if (isNaN(diaInicio) || diaInicio < 1 || diaInicio > diasDelMesActual) {
    mostrarToast("❌ Fecha inválida", true);
    return;
  }
  
  const opcion = confirm("¿Cubrir con trabajador nuevo? (Aceptar = Sí, Cancelar = Redistribuir entre activos)");
  
  if (opcion) {
    // Cubrir con trabajador nuevo
    const nuevoId = trabajadores.length;
    const nuevoNombre = prompt("Nombre del nuevo trabajador sustituto:", `SUSTITUTO_${trabajador.nombre}`);
    if (!nuevoNombre) return;
    
    trabajadores.push({
      id: nuevoId,
      nombre: nuevoNombre,
      estado: "sustituto",
      fechaInicioBaja: null,
      fechaFinBaja: null,
      cubreA: trabajador.id,
      notas: `Sustituye a ${trabajador.nombre} desde día ${diaInicio}`
    });
    
    // Copiar turnos desde el día de inicio
    const nuevaFila = [...(cuadrante[idTrabajador] || [])];
    for (let i = diaInicio - 1; i < diasDelMesActual; i++) {
      nuevaFila[i] = cuadrante[idTrabajador][i] || "";
    }
    cuadrante.push(nuevaFila);
    
    // Marcar baja del original
    trabajador.estado = "baja";
    trabajador.fechaInicioBaja = diaInicio;
    
    // Limpiar turnos del original desde el día de inicio
    for (let i = diaInicio - 1; i < diasDelMesActual; i++) {
      if (cuadrante[idTrabajador]) cuadrante[idTrabajador][i] = "L";
    }
    
    mostrarToast(`✅ Baja cubierta por nuevo trabajador: ${nuevoNombre}`);
  } else {
    // Redistribuir entre activos
    const turnosAPerdidos = [];
    for (let i = diaInicio - 1; i < diasDelMesActual; i++) {
      const turno = cuadrante[idTrabajador]?.[i];
      if (turno && turno !== "L" && turno !== "D" && turno !== "") {
        turnosAPerdidos.push({ dia: i, turno: turno });
      }
    }
    
    if (turnosAPerdidos.length === 0) {
      mostrarToast("No hay turnos que redistribuir (el trabajador ya estaba libre)");
      trabajador.estado = "baja";
      trabajador.fechaInicioBaja = diaInicio;
      guardarDatos();
      renderTrabajadores();
      return;
    }
    
    // Obtener activos (excluyendo al de baja)
    const activos = trabajadores.filter(t => t.id !== idTrabajador && t.estado === "activo");
    
    for (const turno of turnosAPerdidos) {
      // Buscar candidato con menor carga que no supere 6 días seguidos
      let mejorCandidato = null;
      let menorCarga = Infinity;
      
      for (const candidato of activos) {
        // Calcular carga actual del candidato
        let carga = 0;
        const filaCand = cuadrante[candidato.id] || [];
        for (let i = 0; i < diasDelMesActual; i++) {
          carga += getHorasTurno(filaCand[i]);
        }
        
        const seguidosSiAcepta = getMaxDiasSeguidos(candidato.id, turno.dia) + 1;
        if (seguidosSiAcepta <= 6 && carga < menorCarga) {
          menorCarga = carga;
          mejorCandidato = candidato;
        }
      }
      
      if (mejorCandidato) {
        if (!cuadrante[mejorCandidato.id]) cuadrante[mejorCandidato.id] = [];
        cuadrante[mejorCandidato.id][turno.dia] = turno.turno;
        mostrarToast(`📌 Turno ${turno.turno} del día ${turno.dia + 1} asignado a ${mejorCandidato.nombre}`);
      } else {
        mostrarToast(`⚠️ No se pudo asignar el turno del día ${turno.dia + 1} (${turno.turno}). Queda pendiente.`, true);
      }
    }
    
    // Marcar baja del original
    trabajador.estado = "baja";
    trabajador.fechaInicioBaja = diaInicio;
    for (let i = diaInicio - 1; i < diasDelMesActual; i++) {
      if (cuadrante[idTrabajador]) cuadrante[idTrabajador][i] = "L";
    }
    
    mostrarToast(`✅ Baja de ${trabajador.nombre} procesada. Turnos redistribuidos.`);
  }
  
  guardarDatos();
  renderTrabajadores();
  if (currentView === "cuadrante") renderizarCuadrante();
}

function renderSeguro() {
  document.getElementById("content").innerHTML = `
    <div class="card"><div class="card-header">🔒 Copia de seguridad</div><div class="card-body">
      <button class="btn-primary" onclick="exportarDatos()">💾 Exportar copia de seguridad</button>
      <button class="btn-secondary" onclick="triggerImport()">📂 Importar copia de seguridad</button>
      <div style="margin-top: 12px; font-size: 12px; color: #64748b;">📌 La copia incluye: trabajadores, cuadrante y configuración de meses.</div>
    </div></div>
  `;
}

function exportarDatos() {
  const data = { trabajadores, cuadrante, mesActual };
  const dataStr = JSON.stringify(data, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.download = `cuadrante_backup_${new Date().toISOString().slice(0,19).replace(/:/g, "-")}.json`;
  a.href = url;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast("✅ Copia de seguridad exportada");
}

function triggerImport() { document.getElementById("import-file").click(); }
function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.trabajadores && imported.cuadrante) {
        trabajadores = imported.trabajadores;
        cuadrante = imported.cuadrante;
        mesActual = imported.mesActual !== undefined ? imported.mesActual : 5;
        diasDelMesActual = MESES[mesActual].dias;
        guardarDatos();
        mostrarToast(`✅ Importado: ${trabajadores.length} trabajadores`);
        render();
      } else throw new Error("Formato inválido");
    } catch(err) { mostrarToast("❌ Archivo no válido", true); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function mostrarToast(msg, isError = false) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.background = isError ? "#dc2626" : "#0f172a";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
  setTimeout(() => { toast.style.background = "#0f172a"; }, 2100);
}

function showView(view) {
  currentView = view;
  document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(`nav-${view}`).classList.add("active");
  if (view === "home") renderHome();
  else if (view === "cuadrante") renderizarCuadrante();
  else if (view === "trabajadores") renderTrabajadores();
  else if (view === "seguro") renderSeguro();
}

function render() { showView(currentView); }

// Exponer funciones globales
window.cambiarMes = cambiarMes;
window.importarNuevoCuadrante = importarNuevoCuadrante;
window.editarCelda = editarCelda;
window.iniciarBaja = iniciarBaja;
window.añadirTrabajador = añadirTrabajador;
window.verDetalleTrabajador = verDetalleTrabajador;
window.exportarDatos = exportarDatos;
window.triggerImport = triggerImport;
window.handleImport = handleImport;
window.showView = showView;

// Inicializar
cargarDatos();
renderHome();
</script>
</body>
