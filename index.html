<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestión Cuadrantes">
<meta name="theme-color" content="#0f172a">
<title>Gestión Cuadrantes 🧹</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f0f4f8; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #0f172a; overflow: hidden; height: 100dvh; }
  #app { display: flex; flex-direction: column; height: 100dvh; background: #f0f4f8; }

  #header { background: #0f172a; color: #fff; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 10px; }
  #header-left h1 { font-size: 18px; font-weight: 800; }
  #header-left p { font-size: 11px; color: #94a3b8; margin-top: 1px; }
  #save-indicator { font-size: 11px; color: #22c55e; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #save-indicator.show { opacity: 1; }
  #pin-lock-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px; }

  #content { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  #nav { display: flex; background: #fff; border-top: 1.5px solid #e2e8f0; flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #nav button { flex: 1; background: none; border: none; padding: 10px 0 5px; cursor: pointer; color: #94a3b8; border-top: 2.5px solid transparent; font-weight: 600; }
  #nav button.active { color: #0f172a; border-top-color: #0f172a; }
  #nav button .ni { font-size: 20px; display: block; }
  #nav button .nl { font-size: 10px; margin-top: 1px; }

  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .card-header { padding: 12px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
  .card-body { padding: 14px 16px; }

  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; font-size: 13px; transition: opacity .15s; width: 100%; margin-bottom: 8px; text-align: center; }
  .btn-primary { background: #0f172a; color: #fff; }
  .btn-secondary { background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f172a; }
  .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .btn-legal { background: #1e40af; color: #fff; }
  .btn-success { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
  .btn-sm { padding: 6px 12px; border-radius: 20px; font-size: 11px; margin-bottom: 0; width: auto; display: inline-block; }
  .btn-xs { padding: 4px 8px; border-radius: 8px; font-size: 10px; margin-bottom: 0; width: auto; display: inline-block; }

  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; display: inline-block; }
  .badge-baja { background: #dc2626; color: #fff; }
  .badge-emb { background: #db2777; color: #fff; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-green { background: #dcfce7; color: #14532d; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #6d28d9; }
  .badge-gray { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

  .aviso { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 12px; border-left: 4px solid; }
  .aviso-rojo { background: #fee2e2; border-color: #dc2626; }
  .aviso-amber { background: #fef3c7; border-color: #d97706; }
  .aviso-verde { background: #dcfce7; border-color: #16a34a; }
  .aviso-azul { background: #dbeafe; border-color: #2563eb; }
  .aviso-gris { background: #f1f5f9; border-color: #94a3b8; }
  .banner-vencido { background: #dc2626; color: #fff; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 12px; font-weight: 600; text-align: center; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-wd { font-size: 10px; font-weight: 700; color: #64748b; padding: 4px 0; }
  .cal-day { background: #f8fafc; border-radius: 10px; padding: 8px 2px; border: 1px solid #e2e8f0; cursor: default; }
  .cal-day.hoy { background: #0f172a; color: #fff; }
  .cal-day-num { font-size: 13px; font-weight: 600; }
  .cal-dot { width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; }
  .cal-dot.rojo { background: #dc2626; }
  .cal-dot.amber { background: #d97706; }
  .cal-dot.verde { background: #16a34a; }

  .mes-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .mes-btn { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px; padding: 5px 11px; font-size: 11px; cursor: pointer; }
  .mes-btn.active { background: #0f172a; color: #fff; }

  .cuad-toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .cuad-search { flex: 1; min-width: 140px; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 13px; background: #fff; outline: none; }

  .wrap { overflow-x: auto; padding-bottom: 4px; }
  table { border-collapse: collapse; font-size: 11px; width: 100%; }
  th, td { border: 0.5px solid #cbd5e1; text-align: center; padding: 3px 2px; min-width: 26px; }
  th { background: #f1f5f9; font-weight: 700; font-size: 10px; position: sticky; top: 0; z-index: 2; }
  th.col-nombre, td.col-nombre { text-align: left; padding-left: 8px; min-width: 160px; position: sticky; left: 0; background: #fff; z-index: 1; }
  th.col-total, td.col-total { min-width: 38px; font-weight: 700; position: sticky; right: 0; background: #e8f4fd; }
  tr:nth-child(even) td { background: #f8fafc; }
  .wkend { background: #eef2ff !important; }
  .editable-cell { cursor: pointer; }
  .editable-cell:active { background: #dbeafe !important; }
  .baja-row td { opacity: 0.55; background: #fff5f5 !important; }
  .L { color: #1d4ed8; font-weight: 700; }
  .D { color: #15803d; font-weight: 700; }
  .F1 { color: #b91c1c; font-weight: 700; }
  .N { color: #92400e; font-weight: 700; }
  .M, .T { color: #374151; font-weight: 600; }
  .HE { color: #6d28d9; font-weight: 700; }
  .LIB { color: #0e7490; font-weight: 700; }
  .VAC { color: #065f46; font-weight: 700; background: #d1fae5 !important; }
  .cobertura-row td { background: #f0fdf4; font-weight: 700; color: #15803d; border-top: 2px solid #86efac; }

  .worker-search { width: 100%; padding: 9px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; margin-bottom: 12px; outline: none; }
  .worker-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 13px; cursor: pointer; margin-bottom: 8px; transition: box-shadow .15s; }
  .worker-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .worker-stats { font-size: 11px; color: #64748b; margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .worker-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .bolsa-pos { color: #16a34a; font-weight: 700; }
  .bolsa-neg { color: #dc2626; font-weight: 700; }
  .vac-bar { height: 5px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .vac-bar-fill { height: 100%; background: #16a34a; border-radius: 3px; }

  .filtro-tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
  .filtro-tab { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px; padding: 5px 12px; font-size: 11px; cursor: pointer; white-space: nowrap; font-weight: 600; flex-shrink: 0; }
  .filtro-tab.active { background: #0f172a; color: #fff; border-color: #0f172a; }

  .tarea-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .tarea-info { flex: 1; }
  .tarea-nombre { font-weight: 600; font-size: 13px; }
  .tarea-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
  .modal-box { background: #fff; border-radius: 24px 24px 0 0; padding: 22px 20px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; }
  .modal-box.centered { border-radius: 20px; margin: 16px; max-height: 88vh; align-self: center; }
  .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
  .modal-label { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; margin-top: 12px; display: block; }
  .modal-input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
  .modal-input:focus { border-color: #0f172a; }
  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 14px; }
  .btn-modal-ok { background: #0f172a; color: #fff; }
  .btn-modal-cancel { background: #f1f5f9; color: #0f172a; }
  .modal-section { border-top: 1px solid #f1f5f9; margin-top: 16px; padding-top: 14px; }
  .modal-section-title { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }

  .zona-check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .zona-check-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; }
  .zona-check-item.selected { background: #dbeafe; border-color: #93c5fd; }
  .zona-check-item input { display: none; }
  .zona-check-label { font-size: 12px; font-weight: 600; }
  .zona-check-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; flex-shrink: 0; }
  .zona-check-item.selected .zona-check-dot { background: #2563eb; }

  .turno-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .turno-btn { padding: 14px 4px; border-radius: 12px; border: 2px solid transparent; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; }
  .turno-btn:active { transform: scale(0.96); }
  .turno-btn.sel { border-color: #0f172a !important; }
  .tb-L { background: #dbeafe; color: #1d4ed8; }
  .tb-D { background: #dcfce7; color: #15803d; }
  .tb-F1 { background: #fee2e2; color: #b91c1c; }
  .tb-N { background: #fef3c7; color: #92400e; }
  .tb-M, .tb-T { background: #f1f5f9; color: #374151; }
  .tb-HE { background: #ede9fe; color: #6d28d9; }
  .tb-LIB { background: #cffafe; color: #0e7490; }
  .tb-VAC { background: #d1fae5; color: #065f46; }
  .tb-clear { background: #f1f5f9; color: #94a3b8; }
  .turno-label { font-size: 9px; font-weight: 600; margin-top: 3px; opacity: 0.75; }

  .turno-hab-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .turno-hab-btn { padding: 8px 14px; border-radius: 20px; border: 2px solid #e2e8f0; font-size: 12px; font-weight: 700; cursor: pointer; background: #f8fafc; }
  .turno-hab-btn.sel { border-color: #0f172a; background: #0f172a; color: #fff; }

  .restriccion-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .restriccion-btn { padding: 6px 12px; border-radius: 20px; border: 2px solid #e2e8f0; font-size: 11px; font-weight: 700; cursor: pointer; background: #f8fafc; }
  .restriccion-btn.sel { border-color: #dc2626; background: #fee2e2; color: #991b1b; }

  .zona-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .zona-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .zona-nombre { font-weight: 800; font-size: 14px; }
  .zona-turnos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .zona-turno-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; text-align: center; }
  .zona-turno-label { font-size: 10px; color: #64748b; font-weight: 600; }
  .zona-turno-num { font-size: 20px; font-weight: 800; color: #0f172a; }
  .zona-workers { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }

  .puesto-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .puesto-info { flex: 1; }
  .puesto-nombre { font-weight: 700; font-size: 13px; }
  .puesto-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

  .pin-display { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: #e2e8f0; }
  .pin-dot.filled { background: #0f172a; }
  .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 0 auto; }
  .pin-key { padding: 16px; border-radius: 14px; background: #f1f5f9; border: none; font-size: 20px; font-weight: 700; cursor: pointer; }

  .hist-item { font-size: 11px; padding: 8px 16px; border-bottom: 1px solid #f1f5f9; color: #64748b; }
  .festivo-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 20px; padding: 4px 10px; font-size: 12px; margin: 3px; }

  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 500; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .empty { text-align: center; padding: 28px; color: #94a3b8; font-size: 13px; }
  input[type=file] { display: none; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .num-spinner { display: flex; align-items: center; gap: 8px; }
  .num-spinner button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f1f5f9; font-size: 18px; font-weight: 700; cursor: pointer; }
  .num-spinner input { width: 50px; text-align: center; padding: 6px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 16px; font-weight: 700; outline: none; }

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    body { overflow: visible; height: auto; background: #fff; }
    #app { height: auto; }
    #header, #nav, #toast { display: none !important; }
    #content { overflow: visible; padding: 0; }
    .card { border-radius: 0; box-shadow: none; page-break-inside: avoid; }
    table { font-size: 7px; }
    th, td { padding: 2px 1px; min-width: auto; }
    .btn, .mes-selector, .cuad-toolbar, .aviso { display: none !important; }
    .wrap { overflow: visible; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-left"><h1>🧹 Gestión Cuadrantes</h1><p id="header-sub">Cargando...</p></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="save-indicator">✓ Guardado</span>
      <button id="pin-lock-btn" onclick="mostrarPantallaPIN('lock')">🔒</button>
    </div>
  </div>
  <div id="content"></div>
  <nav id="nav">
    <button class="active" onclick="showView('home')"      id="nav-home">     <span class="ni">🏠</span><span class="nl">Inicio</span></button>
    <button onclick="showView('cuadrante')"  id="nav-cuadrante"><span class="ni">📅</span><span class="nl">Cuadrante</span></button>
    <button onclick="showView('personal')"   id="nav-personal"> <span class="ni">👥</span><span class="nl">Personal</span></button>
    <button onclick="showView('zonas')"      id="nav-zonas">    <span class="ni">🏥</span><span class="nl">Zonas</span></button>
    <button onclick="showView('tareas')"     id="nav-tareas">   <span class="ni">✅</span><span class="nl">Tareas</span></button>
    <button onclick="showView('seguro')"     id="nav-seguro">   <span class="ni">🔒</span><span class="nl">Seguro</span></button>
  </nav>
</div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".json" onchange="importarBackup(event)">
<input type="file" id="file-import-legal" accept=".json" onchange="importarLegal(event)">

<script>

const APP_VERSION = 5;
const MESES_NOMBRES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["D","L","M","X","J","V","S"];
const TURNOS_HABITUALES = ["M","T","N","F1","Rotativo","Sin asignar"];
const ZONA_COLORES = ["#dbeafe","#dcfce7","#fee2e2","#fef3c7","#ede9fe","#cffafe","#fce7f3","#fff7ed"];

function diasEnMes(mes, anio) { return new Date(anio, mes + 1, 0).getDate(); }
function esFinDeSemana(dia, mes, anio) { const dow = new Date(anio, mes, dia).getDay(); return dow === 0 || dow === 6; }

const CODIGOS_TURNO = [
  { cod:"L",   label:"Libre",       horas:0, bg:"#dbeafe", color:"#1d4ed8" },
  { cod:"D",   label:"Descanso",    horas:0, bg:"#dcfce7", color:"#15803d" },
  { cod:"F1",  label:"Jornada",     horas:7, bg:"#fee2e2", color:"#b91c1c" },
  { cod:"N",   label:"Noche",       horas:8, bg:"#fef3c7", color:"#92400e" },
  { cod:"M",   label:"Mañana",      horas:7, bg:"#f1f5f9", color:"#374151" },
  { cod:"T",   label:"Tarde",       horas:7, bg:"#f1f5f9", color:"#374151" },
  { cod:"HE",  label:"H.Extra",     horas:0, bg:"#ede9fe", color:"#6d28d9" },
  { cod:"LIB", label:"Libranza",    horas:0, bg:"#cffafe", color:"#0e7490" },
  { cod:"VAC", label:"Vacaciones",  horas:0, bg:"#d1fae5", color:"#065f46" },
  { cod:"",    label:"Borrar",      horas:0, bg:"#f1f5f9", color:"#94a3b8" },
];
function horasCodigo(cod) {
  if (!cod) return 0;
  const num = parseInt(cod);
  if (!isNaN(num) && num >= 2 && num <= 9) return num;
  const entry = CODIGOS_TURNO.find(c => c.cod === cod);
  return entry ? entry.horas : 0;
}

// ==================== FUNCIONES CUADRANTE ====================
function clavesMes(mes, anio) { return `${anio}-${mes}`; }

function getCuadranteMes(mes, anio) {
  const key = clavesMes(mes, anio);
  if (!state.cuadrantePorMes[key]) {
    const dias = diasEnMes(mes, anio);
    state.cuadrantePorMes[key] = PLANTILLA_BASE.map(fila => {
      const nueva = [];
      for (let i = 0; i < dias; i++) nueva[i] = (fila[i] !== undefined) ? fila[i] : "";
      return nueva;
    });
    while (state.cuadrantePorMes[key].length < state.trabajadores.length) {
      state.cuadrantePorMes[key].push(Array(dias).fill(""));
    }
  }
  return state.cuadrantePorMes[key];
}

function setCelda(trabId, dia, valor, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx === -1) return;
  const anterior = cuad[idx]?.[dia] ?? "";
  undoStack.push({ trabId, dia, mes, anio, anterior, nuevo: valor });
  if (undoStack.length > 20) undoStack.shift();
  state.historial.unshift({ ts: Date.now(), trabId, mes, anio, dia, anterior, nuevo: valor });
  if (state.historial.length > 200) state.historial.pop();
  if (!cuad[idx]) cuad[idx] = [];
  cuad[idx][dia] = valor;
  guardarDatos();
}

function getTotalHorasMes(trabId, mes, anio) {
  const cuad = getCuadranteMes(mes ?? state.mesActual, anio ?? state.anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return 0;
  return cuad[idx].reduce((s, v) => s + horasCodigo(v), 0);
}

function getTotalHorasAnio(trabId, anio) {
  anio = anio ?? state.anio;
  let total = 0;
  for (let m = 0; m < 12; m++) total += getTotalHorasMes(trabId, m, anio);
  return total;
}

function getVacacionesDisfrutadas(trabId, anio) {
  anio = anio ?? state.anio;
  let dias = 0;
  for (let m = 0; m < 12; m++) {
    const cuad = getCuadranteMes(m, anio);
    const idx = state.trabajadores.findIndex(t => t.id === trabId);
    if (idx < 0 || !cuad[idx]) continue;
    dias += cuad[idx].filter(v => v === "VAC").length;
  }
  return dias;
}

function getMaxDiasSeguidos(trabId, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  let prefijo = [];
  if (mes > 0) {
    const mesAnt = mes - 1;
    const diasAnt = diasEnMes(mesAnt, anio);
    const cuadAnt = getCuadranteMes(mesAnt, anio);
    const idx = state.trabajadores.findIndex(t => t.id === trabId);
    if (idx >= 0 && cuadAnt[idx]) {
      for (let d = Math.max(0, diasAnt - 6); d < diasAnt; d++) prefijo.push(cuadAnt[idx][d] || "");
    }
  }
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  const fila = (idx >= 0 && cuad[idx]) ? cuad[idx] : [];
  const todos = [...prefijo, ...fila];
  let max = 0, actual = 0;
  for (const v of todos) {
    const trabajado = v && v !== "L" && v !== "D" && v !== "VAC" && v !== "";
    if (trabajado) { actual++; max = Math.max(max, actual); }
    else actual = 0;
  }
  return max;
}

function haTrabajado(trabId, mes, anio) {
  const cuad = getCuadranteMes(mes ?? state.mesActual, anio ?? state.anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return false;
  return cuad[idx].some(v => v && v !== "L" && v !== "D" && v !== "");
}

function esFestivo(dia, mes, anio) {
  const key = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  return state.festivos.includes(key);
}

function coberturaDelDia(dia, mes, anio) {
  const cuad = getCuadranteMes(mes ?? state.mesActual, anio ?? state.anio);
  const result = { M: 0, T: 0, N: 0 };
  state.trabajadores.forEach((t, idx) => {
    if (t.estado === "baja") return;
    const v = cuad[idx]?.[dia] || "";
    if (v === "M") result.M++;
    else if (v === "T") result.T++;
    else if (v === "N") result.N++;
  });
  return result;
}

function validarCuadrante() {
  const inc = [];
  const { jornadaMaxDiaria, jornadaMinDiaria, jornadaMaxSemanal, maxDiasSeguidos } = state.parametros;
  for (const t of state.trabajadores) {
    if (t.estado === "baja") continue;
    const seg = getMaxDiasSeguidos(t.id);
    if (seg > maxDiasSeguidos) inc.push(`⚠️ ${t.nombre}: ${seg} días seguidos`);
    const horasMes = getTotalHorasMes(t.id);
    if (horasMes > 220) inc.push(`⚠️ ${t.nombre}: ${horasMes}h este mes (máx 220h)`);
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    if (bolsa < -40) inc.push(`📊 ${t.nombre}: bolsa de horas ${bolsa}h (déficit)`);
    if (t.embarazo) {
      const cuad = getCuadranteMes(state.mesActual, state.anio);
      const idx = state.trabajadores.indexOf(t);
      if (cuad[idx]?.includes("N")) inc.push(`🤰 ${t.nombre}: tiene turno de noche (LPRL)`);
    }
    const vacDis = getVacacionesDisfrutadas(t.id);
    if (vacDis > state.parametros.vacacionesAnuales) inc.push(`🏖 ${t.nombre}: ${vacDis} días vacaciones (máx ${state.parametros.vacacionesAnuales})`);
  }
  return inc;
}

// ==================== PIN ====================
function hashSimple(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
  return h.toString(36);
}

function mostrarPantallaPIN(modo) {
  if (modo === "lock") { pinDesbloqueado = false; mostrarPantallaPIN("unlock"); return; }
  if (!state.pinHash && modo === "unlock") { pinDesbloqueado = true; return; }
  let entrada = "";
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box centered" style="max-width:320px;text-align:center">
    <div class="modal-title">${modo === "setup" ? "Crear PIN" : "🔒 Introduce tu PIN"}</div>
    <div class="pin-display" id="pd">${[0,1,2,3].map(() => '<div class="pin-dot"></div>').join("")}</div>
    <div class="pin-keypad">${[1,2,3,4,5,6,7,8,9,"","0","⌫"].map(k => k === "" ? `<div></div>` : `<button class="pin-key" onclick="pinTecla('${k}')">${k}</button>`).join("")}</div>
    <button onclick="cerrarModal()" style="margin-top:14px;background:none;border:none;color:#94a3b8">Cancelar</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.dataset.pinModo = modo;
  overlay.dataset.pinEtapa = "1";
  overlay.dataset.pinPrimero = "";
  window.pinTecla = function(k) {
    if (k === "⌫") entrada = entrada.slice(0, -1);
    else if (entrada.length < 4) entrada += k;
    const dots = document.querySelectorAll(".pin-dot");
    dots.forEach((d, i) => d.classList.toggle("filled", i < entrada.length));
    if (entrada.length !== 4) return;
    setTimeout(() => {
      if (modo === "unlock") {
        if (hashSimple(entrada) === state.pinHash) { pinDesbloqueado = true; cerrarModal(); mostrarToast("✅ Desbloqueada"); render(); }
        else { entrada = ""; dots.forEach(d => d.classList.remove("filled")); mostrarToast("❌ PIN incorrecto", true); }
      } else if (modo === "setup") {
        if (overlay.dataset.pinEtapa === "1") {
          overlay.dataset.pinPrimero = entrada;
          overlay.dataset.pinEtapa = "2";
          entrada = "";
          dots.forEach(d => d.classList.remove("filled"));
          overlay.querySelector(".modal-title").textContent = "Confirma el PIN";
        } else {
          if (entrada === overlay.dataset.pinPrimero) {
            state.pinHash = hashSimple(entrada);
            pinDesbloqueado = true;
            guardarDatos(); cerrarModal(); mostrarToast("✅ PIN configurado");
          } else {
            overlay.dataset.pinEtapa = "1";
            entrada = "";
            dots.forEach(d => d.classList.remove("filled"));
            overlay.querySelector(".modal-title").textContent = "Crear PIN";
            mostrarToast("❌ Los PIN no coinciden", true);
          }
        }
      }
    }, 120);
  };
}

      trabajadoresZona.forEach(t => {
        const idx = state.trabajadores.indexOf(t);
        const cuad = getCuadranteMes(mes, anio);
        const v = cuad[idx]?.[diaHoy-1] || "";
        if (v === "M") cobZona.M++;
        else if (v === "T") cobZona.T++;
        else if (v === "N") cobZona.N++;
      });
      if ((zona.coberturaMin.M > 0 && cobZona.M < zona.coberturaMin.M) ||
          (zona.coberturaMin.T > 0 && cobZona.T < zona.coberturaMin.T) ||
          (zona.coberturaMin.N > 0 && cobZona.N < zona.coberturaMin.N)) {
        html += `<div class="aviso aviso-rojo" style="margin-top:6px">🚨 ${zona.nombre}: cobertura insuficiente</div>`;
      }
    }
    html += `</div></div>`;
  }

  const enBaja = state.trabajadores.filter(t => t.estado === "baja").length;
  const embarazadas = state.trabajadores.filter(t => t.embarazo).length;
  html += `<div class="card"><div class="card-header">📋 Resumen</div><div class="card-body" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px">
    <div style="text-align:center;padding:10px;background:#f8fafc;border-radius:10px"><div style="font-size:20px;font-weight:800">${state.trabajadores.length}</div><div style="font-size:10px">Trabajadores</div></div>
    <div style="text-align:center;padding:10px;background:#fff5f5;border-radius:10px"><div style="font-size:20px;font-weight:800;color:#dc2626">${enBaja}</div><div style="font-size:10px">En baja</div></div>
    <div style="text-align:center;padding:10px;background:#fce7f3;border-radius:10px"><div style="font-size:20px;font-weight:800;color:#db2777">${embarazadas}</div><div style="font-size:10px">Embarazos</div></div>
    <div style="text-align:center;padding:10px;background:#f0fdf4;border-radius:10px"><div style="font-size:20px;font-weight:800;color:#16a34a">${state.zonas.length}</div><div style="font-size:10px">Zonas</div></div>
  </div></div>`;

  document.getElementById("content").innerHTML = html;
  document.getElementById("header-sub").textContent = `${MESES_NOMBRES[mes]} ${anio}`;
}

// ==================== VISTA CUADRANTE ====================
function renderCuadrante() {
  const mes = state.mesActual;
  const anio = state.anio;
  const dias = diasEnMes(mes, anio);
  const cuad = getCuadranteMes(mes, anio);

  let html = `<div class="mes-selector">`;
  MESES_NOMBRES.forEach((n, i) => html += `<button class="mes-btn${i === mes ? " active" : ""}" onclick="cambiarMes(${i})">${n.slice(0,3)}</button>`);
  html += `</div><div class="cuad-toolbar"><input class="cuad-search" id="cuad-search" type="search" placeholder="🔍 Buscar trabajador..." value="${cuadFiltro}" oninput="cuadFiltroChange(this.value)"><button class="btn btn-secondary btn-sm" onclick="undoUltimoCambio()">↩ Deshacer</button><button class="btn btn-primary btn-sm" onclick="generarPDF()">📄 PDF</button></div>`;
  html += `<div class="aviso aviso-gris" style="margin-bottom:8px;font-size:11px">Pulsa una celda para cambiar el turno · Preaviso legal: ${state.parametros.preavisoDias} días</div>`;

  const filtrados = state.trabajadores.filter(t => !cuadFiltro || t.nombre.toLowerCase().includes(cuadFiltro.toLowerCase()));
  html += `<div class="wrap"><tr><thead><th class="col-nombre">Trabajador</th>`;
  for (let d = 1; d <= dias; d++) {
    const fds = esFinDeSemana(d, mes, anio);
    html += `<th class="${fds ? "wkend" : ""}">${d}</th>`;
  }
  html += `<th class="col-total">H</th></thead><tbody>`;

  for (const t of filtrados) {
    const idx = state.trabajadores.indexOf(t);
    const total = getTotalHorasMes(t.id, mes, anio);
    const seg = getMaxDiasSeguidos(t.id, mes, anio);
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    const zona = state.zonas.find(z => z.id === t.zonaPrincipalId);
    html += `<tr class="${t.estado === "baja" ? "baja-row" : ""}"><td class="col-nombre">${t.nombre}${t.estado === "baja" ? '<span class="badge badge-baja" style="margin-left:4px">BAJA</span>' : ""}${t.embarazo ? "🤰" : ""}${seg > state.parametros.maxDiasSeguidos ? "⚠️" : ""}${bolsa < -40 ? "📉" : ""}${zona ? `<span style="color:#94a3b8;font-size:9px;margin-left:4px">${zona.nombre}</span>` : ""}</td>`;
    for (let d = 0; d < dias; d++) {
      const val = cuad[idx]?.[d] || "";
      const fds = esFinDeSemana(d + 1, mes, anio);
      const fechaCelda = new Date(anio, mes, d + 1);
      const diff = Math.ceil((fechaCelda - new Date()) / 86400000);
      const preaviso = diff > 0 && diff <= state.parametros.preavisoDias;
      html += `<td class="editable-cell ${val} ${fds ? "wkend" : ""}" style="${preaviso ? "border-bottom:2px solid #d97706" : ""}" onclick="abrirSelectorTurno('${t.id}',${d})">${val}</td>`;
    }
    html += `<td class="col-total">${total}</td></tr>`;
  }

  html += `<tr class="cobertura-row"><td class="col-nombre">Cobertura M/T/N</td>`;
  for (let d = 0; d < dias; d++) {
    const cob = coberturaDelDia(d, mes, anio);
    let deficit = false;
    for (const zona of state.zonas) {
      if ((zona.coberturaMin.M > 0 && cob.M < zona.coberturaMin.M) ||
          (zona.coberturaMin.T > 0 && cob.T < zona.coberturaMin.T) ||
          (zona.coberturaMin.N > 0 && cob.N < zona.coberturaMin.N)) {
        deficit = true; break;
      }
    }
    html += `<td style="${deficit ? "background:#fee2e2;color:#dc2626" : ""}">${cob.M}/${cob.T}/${cob.N}</td>`;
  }
  html += `<td class="col-total"></td></tr></tbody></table></div>`;
  document.getElementById("content").innerHTML = html;
}

function cuadFiltroChange(val) { cuadFiltro = val; renderCuadrante(); }
function cambiarMes(mes) { state.mesActual = mes; guardarDatos(); if (currentView === "cuadrante") renderCuadrante(); if (currentView === "home") renderHome(); mostrarToast(`📅 ${MESES_NOMBRES[mes]} ${state.anio}`); }

function abrirSelectorTurno(trabId, dia) {
  const t = state.trabajadores.find(t => t.id === trabId);
  const valorActual = getCuadranteMes(state.mesActual, state.anio)[state.trabajadores.indexOf(t)]?.[dia] || "";
  const fechaCelda = new Date(state.anio, state.mesActual, dia + 1);
  const diff = Math.ceil((fechaCelda - new Date()) / 86400000);
  if (diff > 0 && diff <= state.parametros.preavisoDias && !confirm(`⚠️ Preaviso legal (${state.parametros.preavisoDias} días). ¿Modificar igualmente?`)) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">Turno — ${t.nombre.split(" ")[0]} · día ${dia+1}</div><div class="turno-grid">${CODIGOS_TURNO.map(c => `<div><button class="turno-btn tb-${c.cod || "clear"}${valorActual === c.cod ? " sel" : ""}" onclick="seleccionarTurno('${trabId}',${dia},'${c.cod}')">${c.cod || "✕"}</button><div class="turno-label">${c.label}</div></div>`).join("")}</div><div style="display:flex;gap:8px;margin-top:8px"><input id="turno-manual" class="modal-input" placeholder="O escribe: 2-9, F2, G…" style="flex:1"><button class="btn btn-primary btn-sm" onclick="seleccionarTurnoManual('${trabId}',${dia})">OK</button></div><button onclick="cerrarModal()" class="btn btn-secondary" style="margin-top:10px">Cancelar</button></div>`;
  document.body.appendChild(overlay);
}

function seleccionarTurno(trabId, dia, valor) {
  const t = state.trabajadores.find(t => t.id === trabId);
  if (t?.embarazo && valor === "N") { mostrarToast("❌ Trabajadora embarazada: no puede tener turno de noche", true); return; }
  if (t?.restriccionesTurno?.includes(valor)) { mostrarToast(`❌ Restricción médica: no puede tener turno ${valor}`, true); return; }
  setCelda(trabId, dia, valor);
  cerrarModal();
  if (currentView === "cuadrante") renderCuadrante();
  mostrarToast(`✓ ${t?.nombre.split(" ")[0]}: día ${dia+1} → ${valor || "vacío"}`);
}

function seleccionarTurnoManual(trabId, dia) {
  const valor = document.getElementById("turno-manual")?.value?.trim() || "";
  seleccionarTurno(trabId, dia, valor);
}

function undoUltimoCambio() {
  if (!undoStack.length) { mostrarToast("No hay cambios que deshacer"); return; }
  const { trabId, dia, mes, anio, anterior } = undoStack.pop();
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx >= 0 && cuad[idx]) cuad[idx][dia] = anterior;
  guardarDatos();
  if (currentView === "cuadrante") renderCuadrante();
  mostrarToast("↩ Cambio deshecho");
}

// ==================== VISTA PERSONAL ====================
function renderPersonal() {
  const mes = state.mesActual, anio = state.anio;

  let html = `<input class="worker-search" type="search" placeholder="🔍 Buscar por nombre..." value="${personalFiltro}" oninput="personalFiltroChange(this.value)">`;
  html += `<div class="filtro-tabs"><button class="filtro-tab${personalFiltroZona==="todas"?" active":""}" onclick="setFiltroZona('todas')">Todas</button>`;
  state.zonas.forEach(z => html += `<button class="filtro-tab${personalFiltroZona===z.id?" active":""}" onclick="setFiltroZona('${z.id}')">${z.nombre}</button>`);
  html += `<button class="filtro-tab${personalFiltroZona==="sin"?" active":""}" onclick="setFiltroZona('sin')">Sin zona</button></div>`;
  html += `<div class="filtro-tabs"><button class="filtro-tab${personalFiltroTurno==="todos"?" active":""}" onclick="setFiltroTurno('todos')">Todos</button>`;
  TURNOS_HABITUALES.forEach(t => html += `<button class="filtro-tab${personalFiltroTurno===t?" active":""}" onclick="setFiltroTurno('${t}')">${t}</button>`);
  html += `</div>`;

  let filtrados = state.trabajadores.filter(t => {
    if (personalFiltro && !t.nombre.toLowerCase().includes(personalFiltro.toLowerCase())) return false;
    if (personalFiltroZona !== "todas") {
      if (personalFiltroZona === "sin") { if (t.zonaPrincipalId) return false; }
      else if (t.zonaPrincipalId !== personalFiltroZona) return false;
    }
    if (personalFiltroTurno !== "todos" && t.turnoHabitual !== personalFiltroTurno) return false;
    return true;
  });

  const trabajan = filtrados.filter(t => haTrabajado(t.id, mes, anio));
  const noTrabajan = filtrados.filter(t => !haTrabajado(t.id, mes, anio));
  html += `<div style="font-size:12px;color:#64748b;margin-bottom:10px">${filtrados.length} trabajadores · ${trabajan.length} han trabajado · ${noTrabajan.length} no han trabajado</div>`;

  html += `<div class="card"><div class="card-header">✅ Han trabajado este mes (${trabajan.length})</div><div class="card-body">`;
  trabajan.forEach(t => html += cardWorkerHtml(t, mes, anio));
  html += `</div></div><div class="card"><div class="card-header">⬜ No han trabajado (${noTrabajan.length})</div><div class="card-body">`;
  noTrabajan.forEach(t => html += cardWorkerHtml(t, mes, anio));
  html += `</div></div><button class="btn btn-primary" onclick="modalNuevoTrabajador()">➕ Añadir trabajador</button>`;
  document.getElementById("content").innerHTML = html;
}

function cardWorkerHtml(t, mes, anio) {
  const horas = getTotalHorasMes(t.id, mes, anio);
  const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
  const seg = getMaxDiasSeguidos(t.id, mes, anio);
  const vacDis = getVacacionesDisfrutadas(t.id);
  const vacTot = t.vacacionesTotales || 30;
  const vacPct = Math.min(100, Math.round(vacDis / vacTot * 100));
  const zona = state.zonas.find(z => z.id === t.zonaPrincipalId);
  return `<div class="worker-item" onclick="modalDetalleWorker('${t.id}')">
    <div class="worker-name">${t.nombre}${t.estado === "baja" ? '<span class="badge badge-baja">BAJA</span>' : ""}${t.embarazo ? '<span class="badge badge-emb">🤰</span>' : ""}</div>
    <div class="worker-tags">${zona ? `<span class="badge badge-blue">${zona.nombre}</span>` : '<span class="badge badge-gray">Sin zona</span>'}${t.turnoHabitual && t.turnoHabitual !== "Sin asignar" ? `<span class="badge badge-amber">${t.turnoHabitual}</span>` : ""}</div>
    <div class="worker-stats"><span>📅 ${horas}h mes</span><span class="${bolsa >= 0 ? "bolsa-pos" : "bolsa-neg"}">${bolsa >= 0 ? "+" : ""}${bolsa}h bolsa</span><span>🔄 ${seg} días</span><span>🏖 ${vacDis}/${vacTot}</span></div>
    <div class="vac-bar"><div class="vac-bar-fill" style="width:${vacPct}%"></div></div>
  </div>`;
}

function setFiltroZona(val) { personalFiltroZona = val; renderPersonal(); }
function setFiltroTurno(val) { personalFiltroTurno = val; renderPersonal(); }
function personalFiltroChange(val) { personalFiltro = val; renderPersonal(); }

function modalDetalleWorker(id) {
  const t = state.trabajadores.find(t => t.id === id);
  if (!t) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">✏️ ${t.nombre}</div>
    <label class="modal-label">Nombre completo</label><input class="modal-input" id="dw-nombre" value="${t.nombre}">
    <label class="modal-label">Estado</label><select class="modal-input" id="dw-estado"><option value="activo" ${t.estado==="activo"?"selected":""}>Activo</option><option value="baja" ${t.estado==="baja"?"selected":""}>Baja</option></select>
    <label class="modal-label">Zona principal</label><select class="modal-input" id="dw-zona"><option value="">Sin zona</option>${state.zonas.map(z => `<option value="${z.id}" ${t.zonaPrincipalId===z.id?"selected":""}>${z.nombre}</option>`).join("")}</select>
    <label class="modal-label">Turno habitual</label><select class="modal-input" id="dw-turno">${TURNOS_HABITUALES.map(tur => `<option ${t.turnoHabitual===tur?"selected":""}>${tur}</option>`).join("")}</select>
    <label class="modal-label">Notas</label><input class="modal-input" id="dw-notas" value="${t.notas || ""}">
    <div style="display:flex;gap:16px;margin-top:12px"><label><input type="checkbox" id="dw-emb" ${t.embarazo?"checked":""}> 🤰 Embarazo</label></div>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="guardarWorker('${id}')">Guardar</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
    <button class="btn btn-danger" style="margin-top:8px" onclick="iniciarBajaWorker('${id}')">🩺 Registrar baja</button>
    <button class="btn btn-danger" style="margin-top:4px" onclick="eliminarTrabajador('${id}')">🗑 Eliminar trabajador</button></div>`;
  document.body.appendChild(overlay);
}

function guardarWorker(id) {
  const t = state.trabajadores.find(t => t.id === id);
  if (!t) return;
  t.nombre = document.getElementById("dw-nombre")?.value?.trim() || t.nombre;
  t.estado = document.getElementById("dw-estado")?.value || t.estado;
  t.zonaPrincipalId = document.getElementById("dw-zona")?.value || "";
  t.turnoHabitual = document.getElementById("dw-turno")?.value || "Sin asignar";
  t.notas = document.getElementById("dw-notas")?.value || "";
  t.embarazo = document.getElementById("dw-emb")?.checked || false;
  guardarDatos(); cerrarModal(); renderPersonal();
  mostrarToast(`✅ ${t.nombre.split(" ")[0]} actualizado`);
}

function eliminarTrabajador(id) {
  if (!confirm("¿Eliminar este trabajador? Se borrará del cuadrante actual.")) return;
  const idx = state.trabajadores.findIndex(t => t.id === id);
  if (idx === -1) return;
  state.trabajadores.splice(idx, 1);
  Object.keys(state.cuadrantePorMes).forEach(key => {
    if (state.cuadrantePorMes[key][idx]) state.cuadrantePorMes[key].splice(idx, 1);
  });
  guardarDatos(); renderPersonal(); if (currentView === "cuadrante") renderCuadrante();
  mostrarToast("🗑 Trabajador eliminado");
}

function modalNuevoTrabajador() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">➕ Nuevo trabajador</div>
    <label class="modal-label">Nombre completo</label><input class="modal-input" id="nt-nombre">
    <label class="modal-label">Zona principal</label><select class="modal-input" id="nt-zona"><option value="">Sin zona</option>${state.zonas.map(z => `<option value="${z.id}">${z.nombre}</option>`).join("")}</select>
    <label class="modal-label">Turno habitual</label><select class="modal-input" id="nt-turno">${TURNOS_HABITUALES.map(t => `<option>${t}</option>`).join("")}</select>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="crearWorker()">Añadir</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

function crearWorker() {
  const nombre = document.getElementById("nt-nombre")?.value?.trim();
  if (!nombre) { mostrarToast("❌ Nombre requerido", true); return; }
  const id = `t_${Date.now()}`;
  state.trabajadores.push({ id, nombre, estado: "activo", embarazo: false, discapacidad: false, puesto: "", zonaPrincipalId: document.getElementById("nt-zona")?.value || "", zonasRotacionIds: [], turnoHabitual: document.getElementById("nt-turno")?.value || "Sin asignar", restriccionesTurno: [], notas: "", vacacionesTotales: 30, fechaBaja: null });
  Object.keys(state.cuadrantePorMes).forEach(k => {
    const [anio, mes] = k.split("-").map(Number);
    state.cuadrantePorMes[k].push(Array(diasEnMes(mes, anio)).fill(""));
  });
  guardarDatos(); cerrarModal(); renderPersonal();
  mostrarToast(`✅ ${nombre.split(" ")[0]} añadido`);
}

function iniciarBajaWorker(id) {
  const t = state.trabajadores.find(t => t.id === id);
  if (!t) return;
  const diaInicio = prompt(`Día de inicio de la baja (1-${diasEnMes(state.mesActual, state.anio)}):`);
  if (!diaInicio) return;
  const dia = parseInt(diaInicio) - 1;
  if (isNaN(dia) || dia < 0) { mostrarToast("❌ Día inválido", true); return; }
  t.estado = "baja";
  t.fechaBaja = `${state.anio}-${String(state.mesActual+1).padStart(2,"0")}-${String(dia+1).padStart(2,"0")}`;
  const cuad = getCuadranteMes(state.mesActual, state.anio);
  const idx = state.trabajadores.indexOf(t);
  for (let d = dia; d < diasEnMes(state.mesActual, state.anio); d++) { if (cuad[idx]) cuad[idx][d] = "L"; }
  guardarDatos(); cerrarModal(); renderPersonal(); if (currentView === "cuadrante") renderCuadrante();
  mostrarToast(`✅ Baja registrada`);
}

// ==================== VISTA ZONAS ====================
function renderZonas() {
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:13px;font-weight:700">${state.zonas.length} zonas configuradas</span><button class="btn btn-primary btn-sm" onclick="modalNuevaZona()">➕ Nueva zona</button></div>`;
  if (!state.zonas.length) html += `<div class="empty">No hay zonas configuradas.</div>`;
  state.zonas.forEach(z => {
    const trabajadoresZona = state.trabajadores.filter(t => t.zonaPrincipalId === z.id);
    html += `<div class="zona-card" style="border-left:4px solid ${z.color || "#e2e8f0"}">
      <div class="zona-card-header"><div class="zona-nombre">${z.nombre}</div><div><button class="btn btn-secondary btn-xs" onclick="modalEditarZona('${z.id}')">✏️</button><button class="btn btn-danger btn-xs" onclick="eliminarZona('${z.id}')">🗑</button></div></div>
      <div class="zona-turnos"><div class="zona-turno-box"><div class="zona-turno-label">🌅 MAÑANA</div><div class="zona-turno-num">${z.coberturaMin?.M ?? 0}</div></div><div class="zona-turno-box"><div class="zona-turno-label">☀️ TARDE</div><div class="zona-turno-num">${z.coberturaMin?.T ?? 0}</div></div><div class="zona-turno-box"><div class="zona-turno-label">🌙 NOCHE</div><div class="zona-turno-num">${z.coberturaMin?.N ?? 0}</div></div></div>
      ${z.notas ? `<div class="zona-notas" style="margin-top:8px;font-size:11px;color:#64748b">📝 ${z.notas}</div>` : ""}
      <div style="margin-top:10px"><div style="font-size:11px;font-weight:700;color:#64748b">PERSONAL (${trabajadoresZona.length})</div><div class="zona-workers">${trabajadoresZona.length === 0 ? '<span style="font-size:11px;color:#94a3b8">Ninguno</span>' : trabajadoresZona.map(t => `<span class="badge ${t.estado==="baja"?"badge-red":"badge-green"}">${t.nombre.split(" ")[0]}</span>`).join("")}</div></div>
    </div>`;
  });
  html += `<div class="card"><div class="card-header">💼 Puestos (${state.puestos.length})<button class="btn btn-primary btn-xs" onclick="modalNuevoPuesto()">➕ Nuevo</button></div><div class="card-body">`;
  if (!state.puestos.length) html += `<div class="empty">No hay puestos</div>`;
  state.puestos.forEach(p => {
    const zona = state.zonas.find(z => z.id === p.zonaId);
    html += `<div class="puesto-item"><div class="puesto-info"><div class="puesto-nombre">${p.nombre}</div><div class="puesto-meta">${zona ? `🏥 ${zona.nombre}` : "Sin zona"} · Turno ${p.turno || "—"}<br>${p.instrucciones ? p.instrucciones.slice(0,60)+"…" : ""}</div></div><div><button class="btn btn-secondary btn-xs" onclick="modalEditarPuesto('${p.id}')">✏️</button><button class="btn btn-danger btn-xs" onclick="eliminarPuesto('${p.id}')">🗑</button></div></div>`;
  });
  html += `</div></div>`;
  document.getElementById("content").innerHTML = html;
}

function modalNuevaZona() { modalEditarZona(null); }
function modalEditarZona(id) {
  const z = id ? state.zonas.find(z => z.id === id) : null;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">${z ? "✏️ Editar zona" : "➕ Nueva zona"}</div>
    <label class="modal-label">Nombre</label><input class="modal-input" id="z-nombre" value="${z?.nombre || ""}">
    <label class="modal-label">Cobertura mínima</label><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div><div style="font-size:11px;font-weight:700">🌅 MAÑANA</div><input type="number" id="z-cob-M" value="${z?.coberturaMin?.M ?? 0}" min="0" max="10" style="width:60px;padding:6px;text-align:center"></div><div><div style="font-size:11px;font-weight:700">☀️ TARDE</div><input type="number" id="z-cob-T" value="${z?.coberturaMin?.T ?? 0}" min="0" max="10" style="width:60px;padding:6px;text-align:center"></div><div><div style="font-size:11px;font-weight:700">🌙 NOCHE</div><input type="number" id="z-cob-N" value="${z?.coberturaMin?.N ?? 0}" min="0" max="10" style="width:60px;padding:6px;text-align:center"></div></div>
    <label class="modal-label">Notas</label><textarea class="modal-input" id="z-notas" rows="2">${z?.notas || ""}</textarea>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="guardarZona('${id || ""}')">Guardar</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

function guardarZona(id) {
  const nombre = document.getElementById("z-nombre")?.value?.trim();
  if (!nombre) { mostrarToast("❌ Nombre requerido", true); return; }
  const coberturaMin = { M: parseInt(document.getElementById("z-cob-M")?.value) || 0, T: parseInt(document.getElementById("z-cob-T")?.value) || 0, N: parseInt(document.getElementById("z-cob-N")?.value) || 0 };
  const notas = document.getElementById("z-notas")?.value || "";
  if (id) { const z = state.zonas.find(z => z.id === id); if (z) { z.nombre = nombre; z.coberturaMin = coberturaMin; z.notas = notas; } mostrarToast(`✅ Zona actualizada`); }
  else { state.zonas.push({ id: `z_${Date.now()}`, nombre, coberturaMin, finDeSemana: true, notas, color: ZONA_COLORES[state.zonas.length % ZONA_COLORES.length] }); mostrarToast(`✅ Zona creada`); }
  guardarDatos(); cerrarModal(); renderZonas();
}

function eliminarZona(id) {
  if (!confirm("¿Eliminar esta zona?")) return;
  state.zonas = state.zonas.filter(z => z.id !== id);
  state.trabajadores.forEach(t => { if (t.zonaPrincipalId === id) t.zonaPrincipalId = ""; });
  guardarDatos(); renderZonas();
  mostrarToast("🗑 Zona eliminada");
}

function modalNuevoPuesto() { modalEditarPuesto(null); }
function modalEditarPuesto(id) {
  const p = id ? state.puestos.find(p => p.id === id) : null;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">${p ? "✏️ Editar puesto" : "➕ Nuevo puesto"}</div>
    <label class="modal-label">Nombre</label><input class="modal-input" id="p-nombre" value="${p?.nombre || ""}">
    <label class="modal-label">Zona asociada</label><select class="modal-input" id="p-zona"><option value="">Sin zona</option>${state.zonas.map(z => `<option value="${z.id}" ${p?.zonaId===z.id?"selected":""}>${z.nombre}</option>`).join("")}</select>
    <label class="modal-label">Turno habitual</label><select class="modal-input" id="p-turno">${TURNOS_HABITUALES.map(t => `<option ${p?.turno===t?"selected":""}>${t}</option>`).join("")}</select>
    <label class="modal-label">Instrucciones</label><textarea class="modal-input" id="p-instrucciones" rows="3">${p?.instrucciones || ""}</textarea>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="guardarPuesto('${id || ""}')">Guardar</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

function guardarPuesto(id) {
  const nombre = document.getElementById("p-nombre")?.value?.trim();
  if (!nombre) { mostrarToast("❌ Nombre requerido", true); return; }
  const zonaId = document.getElementById("p-zona")?.value || "";
  const turno = document.getElementById("p-turno")?.value || "Sin asignar";
  const instrucciones = document.getElementById("p-instrucciones")?.value || "";
  if (id) { const p = state.puestos.find(p => p.id === id); if (p) { p.nombre = nombre; p.zonaId = zonaId; p.turno = turno; p.instrucciones = instrucciones; } mostrarToast(`✅ Puesto actualizado`); }
  else { state.puestos.push({ id: `p_${Date.now()}`, nombre, zonaId, turno, instrucciones }); mostrarToast(`✅ Puesto creado`); }
  guardarDatos(); cerrarModal(); renderZonas();
}

function eliminarPuesto(id) {
  if (!confirm("¿Eliminar este puesto?")) return;
  state.puestos = state.puestos.filter(p => p.id !== id);
  guardarDatos(); renderZonas();
  mostrarToast("🗑 Puesto eliminado");
}

// ==================== VISTA TAREAS ====================
function renderTareas() {
  let html = `<div class="card"><div class="card-header">✅ Tareas pendientes</div><div class="card-body">`;
  const pendientes = state.tareas.filter(t => !t.completada);
  if (!pendientes.length) html += `<div class="empty">Sin tareas pendientes</div>`;
  pendientes.forEach(t => html += `<div class="tarea-item"><div class="tarea-info"><div class="tarea-nombre">${t.nombre}</div><div class="tarea-meta">📅 Día ${t.dia} · <span class="badge ${t.prioridad==="rojo"?"badge-red":t.prioridad==="amber"?"badge-amber":"badge-green"}">${t.prioridad==="rojo"?"🔴 Muy urgente":t.prioridad==="amber"?"🟡 Urgente":"🟢 Poco urgente"}</span></div></div><div><button class="btn btn-success btn-sm" onclick="completarTarea('${t.id}')">✓</button><button class="btn btn-danger btn-sm" onclick="eliminarTarea('${t.id}')">🗑</button></div></div>`);
  html += `<button class="btn btn-primary" style="margin-top:10px" onclick="modalNuevaTarea()">➕ Nueva tarea</button></div></div>`;
  document.getElementById("content").innerHTML = html;
}

function modalNuevaTarea() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">➕ Nueva tarea</div>
    <label class="modal-label">Nombre</label><input class="modal-input" id="nt-nombre">
    <label class="modal-label">Día del mes</label><input type="number" class="modal-input" id="nt-dia" value="1" min="1" max="31">
    <label class="modal-label">Prioridad</label><select class="modal-input" id="nt-prio"><option value="rojo">🔴 Muy urgente</option><option value="amber">🟡 Urgente</option><option value="verde">🟢 Poco urgente</option></select>
    <div class="modal-btns"><button class="btn-modal-ok" onclick="crearTarea()">Añadir</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

function crearTarea() {
  const nombre = document.getElementById("nt-nombre")?.value?.trim();
  const dia = parseInt(document.getElementById("nt-dia")?.value);
  const prioridad = document.getElementById("nt-prio")?.value;
  if (!nombre || isNaN(dia)) { mostrarToast("❌ Nombre y día válidos", true); return; }
  state.tareas.push({ id: `ta_${Date.now()}`, nombre, dia, prioridad, completada: false });
  guardarDatos(); cerrarModal(); renderTareas();
  mostrarToast(`✅ Tarea añadida`);
}

function completarTarea(id) { const t = state.tareas.find(t => t.id === id); if (t) { t.completada = true; guardarDatos(); renderTareas(); mostrarToast(`✔ Tarea completada`); } }
function eliminarTarea(id) { if (confirm("¿Eliminar tarea?")) { state.tareas = state.tareas.filter(t => t.id !== id); guardarDatos(); renderTareas(); mostrarToast("🗑 Tarea eliminada"); } }

// ==================== VISTA SEGURO ====================
function renderSeguro() {
  document.getElementById("content").innerHTML = `
    <div class="card"><div class="card-header">💾 Copia de seguridad</div><div class="card-body"><button class="btn btn-primary" onclick="exportarBackup()">⬇ Exportar backup</button><button class="btn btn-secondary" onclick="document.getElementById('file-import').click()">⬆ Importar backup</button><button class="btn btn-legal" onclick="generarPDF()">📄 Cuadrante PDF</button></div></div>
    <div class="card"><div class="card-header">⚖️ Parámetros del convenio</div><div class="card-body"><button class="btn btn-legal" onclick="document.getElementById('file-import-legal').click()">📄 Importar convenio</button><div style="font-size:12px;margin-top:8px"><strong>Activos:</strong> Jornada máx ${state.parametros.jornadaMaxDiaria}h · Mín ${state.parametros.jornadaMinDiaria}h · Máx semanal ${state.parametros.jornadaMaxSemanal}h · Máx seguidos ${state.parametros.maxDiasSeguidos} · Preaviso ${state.parametros.preavisoDias} días</div><button class="btn btn-secondary" style="margin-top:10px" onclick="validarYMostrar()">🔍 Validar cuadrante</button></div></div>
    <div class="card"><div class="card-header">🔒 Seguridad</div><div class="card-body"><button class="btn btn-secondary" onclick="mostrarPantallaPIN('setup')">${state.pinHash ? "🔑 Cambiar PIN" : "🔑 Configurar PIN"}</button>${state.pinHash ? `<button class="btn btn-danger" style="margin-top:8px" onclick="quitarPIN()">🗑 Eliminar PIN</button>` : ""}</div></div>
    <div class="card"><div class="card-header">📋 Historial de cambios</div><div class="card-body nop">${state.historial.slice(0,20).map(h => { const t = state.trabajadores.find(w => w.id === h.trabId); return `<div class="hist-item"><strong>${t?.nombre?.split(" ")[0] || "?"}</strong> · día ${h.dia+1}/${h.mes+1}: <span style="color:#dc2626">${h.anterior||"—"}</span> → <span style="color:#16a34a">${h.nuevo||"—"}</span></div>`; }).join("") || '<div class="empty">Sin cambios registrados</div>'}</div></div>`;
}

function quitarPIN() { if (confirm("¿Eliminar PIN?")) { state.pinHash = null; guardarDatos(); mostrarToast("PIN eliminado"); renderSeguro(); } }
function exportarBackup() { const a = document.createElement("a"); a.download = `cuadrante_backup_${new Date().toISOString().slice(0,10)}.json`; a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" })); a.click(); URL.revokeObjectURL(a.href); mostrarToast("✅ Backup exportado"); }
function importarBackup(event) { const file = event.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = e => { try { const data = JSON.parse(e.target.result); state = { ...state, ...data }; guardarDatos(); mostrarToast("✅ Backup importado"); render(); } catch { mostrarToast("❌ Archivo inválido", true); } }; r.readAsText(file); event.target.value = ""; }
function importarLegal(event) { const file = event.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = e => { try { const p = JSON.parse(e.target.result); state.parametros = { ...state.parametros, ...p }; guardarDatos(); mostrarToast("✅ Convenio importado"); renderSeguro(); } catch { mostrarToast("❌ Archivo inválido", true); } }; r.readAsText(file); event.target.value = ""; }
function validarYMostrar() { const inc = validarCuadrante(); if (!inc.length) { alert("✅ Sin incidencias"); return; } alert("⚠️ Incidencias:\n\n" + inc.join("\n")); }

// ==================== UTILIDADES ====================
function mostrarToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isError ? "#dc2626" : "#0f172a";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function cerrarModal() { document.querySelectorAll(".modal-overlay").forEach(m => m.remove()); }

function showView(view) {
  if (state.pinHash && !pinDesbloqueado && view !== "home") { mostrarPantallaPIN("unlock"); return; }
  currentView = view;
  document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(`nav-${view}`)?.classList.add("active");
  if (view === "home") renderHome();
  else if (view === "cuadrante") renderCuadrante();
  else if (view === "personal") renderPersonal();
  else if (view === "zonas") renderZonas();
  else if (view === "tareas") renderTareas();
  else if (view === "seguro") renderSeguro();
}
function render() { showView(currentView); }

document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); undoUltimoCambio(); } });
document.addEventListener("click", e => { if (e.target.classList.contains("modal-overlay")) cerrarModal(); });

cargarDatos();
if (state.pinHash) { pinDesbloqueado = false; renderHome(); mostrarPantallaPIN("unlock"); }
else { pinDesbloqueado = true; renderHome(); }
</script>
</body>
</html>
