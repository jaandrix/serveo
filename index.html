<style>

  #header { background: #0f172a; color: #fff; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header h1 { font-size: 20px; font-weight: 800; }
  #header p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  
  #content { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  
  #nav { display: flex; background: #fff; border-top: 1.5px solid #e2e8f0; flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #nav button { flex: 1; background: none; border: none; padding: 11px 0 6px; cursor: pointer; color: #94a3b8; border-top: 2.5px solid transparent; font-weight: 600; }
  #nav button.active { color: #0f172a; border-top-color: #0f172a; }
  #nav button .nav-icon { font-size: 22px; display: block; }

  .card-header { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
  .card-body { padding: 14px 16px; }
  
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }

  .cal-day-num { font-size: 14px; font-weight: 600; }
  .cal-dot { width: 10px; height: 10px; border-radius: 50%; margin: 5px auto 0; }
  .cal-dot.rojo { background: #dc2626; box-shadow: 0 0 4px #dc2626; }
  .cal-dot.amarillo { background: #d97706; box-shadow: 0 0 4px #d97706; }
  .cal-dot.verde { background: #16a34a; box-shadow: 0 0 4px #16a34a; }

  .urgente-amarillo { color: #d97706; }
  .urgente-verde { color: #16a34a; }

  .completado { opacity: 0.5; text-decoration: line-through; }
  
  .wrap { overflow-x: auto; padding: 1rem 0; }
  table { border-collapse: collapse; font-size: 11px; min-width: 900px; width: 100%; }
  th, td { border: 0.5px solid #cbd5e1; text-align: center; padding: 4px 2px; min-width: 28px; }
  th { background: #f1f5f9; font-weight: 600; font-size: 10px; position: sticky; top: 0; }
  th.name, td.name { text-align: left; padding-left: 8px; min-width: 160px; position: sticky; left: 0; background: #fff; z-index: 1; }
  tr:nth-child(even) td { background: #f8fafc; }
  .L { color: #185FA5; font-weight: 600; }
  .D { color: #3B6D11; font-weight: 600; }
  .F1 { color: #A32D2D; font-weight: 600; }
  .N { color: #854F0B; font-weight: 600; }
  .wkend { background: #eef2ff !important; }
  .editable-cell { cursor: pointer; transition: background 0.1s; }
  .editable-cell:active { background: #dbeafe; }
  
  .worker-list { display: flex; flex-direction: column; gap: 8px; }
  .worker-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; cursor: pointer; transition: background 0.1s; }
  .worker-item:active { background: #f1f5f9; }
  .worker-name { font-weight: 700; }
  .worker-summary { font-size: 11px; color: #64748b; margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }

  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 12px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>

// ==================== TAREAS RECURRENTES ====================

function getUrgenciaTarea(tarea) {
  const ahora = new Date();
  const año = ahora.getFullYear();
  const mes = ahora.getMonth();
  const hoy = ahora.getDate();
  const diasDelMes = new Date(año, mes + 1, 0).getDate();
  const diaTarea = tarea.dia;
  
  if (tarea.completada) return null;
  
  const diasRestantes = diaTarea - hoy;
  
  if (diasRestantes <= 1 && diasRestantes >= 0) return "rojo";
  if (diasRestantes <= 7 && diasRestantes > 1) return "amarillo";
  if (diasRestantes > 7) return "verde";
  if (diasRestantes < 0) return null;
  return "verde";
}

function getEventosDelDia(dia) {
  const eventos = [];
  checklist.forEach(tarea => {
    if (tarea.completada) return;
    if (tarea.dia === dia) {
      const urgencia = getUrgenciaTarea(tarea);
      if (urgencia) {
        eventos.push({ nombre: tarea.nombre, urgencia });
      }
    }
  });
  return eventos;
}

function completarTarea(id) {
  const tarea = checklist.find(t => t.id === id);
  if (tarea) {
    tarea.completada = true;
    tarea.completadaEnEsteMes = true;
    mostrarToast(`✅ "${tarea.nombre}" completada`);
    render();
  }
}

// ==================== REGLAS LABORALES ====================
function analizarJornadaTrabajador(nombre, indice) {
  const fila = cuadrante[indice];
  if (!fila) return { trabajados: 0, tipos: {}, seguidos: 0, maxSeguidos: 0 };
  
  let trabajados = 0;
  let tipos = { L:0, D:0, F1:0, N:0, otros:0 };
  let maxSeguidos = 0;
  let actualSeguidos = 0;
  
  for (let i = 0; i < DAYS.length; i++) {
    const val = fila[i];
    const tieneTurno = val && val.trim() !== "";
    if (tieneTurno && val !== "L" && val !== "D" && val !== "U") {
      trabajados++;
      actualSeguidos++;
      maxSeguidos = Math.max(maxSeguidos, actualSeguidos);
    } else {
      actualSeguidos = 0;
    }
    
    if (val === "L") tipos.L++;
    else if (val === "D") tipos.D++;
    else if (val === "F1") tipos.F1++;
    else if (val === "N") tipos.N++;
    else if (tieneTurno && val !== "U") tipos.otros++;
  }
  
  return { trabajados, tipos, maxSeguidos };
}

// ==================== EDICIÓN CUADRANTE ====================
function mostrarModalEdicion(filaIdx, colIdx, valorActual) {
  const nuevoValor = prompt(`Editar celda (${NAMES[filaIdx]}, día ${DAYS[colIdx]})`, valorActual);
  if (nuevoValor !== null) {
    cuadrante[filaIdx][colIdx] = nuevoValor;
    guardarCuadrante();
    mostrarToast(`Cambiado a "${nuevoValor}"`);
    if (currentView === "cuadrante") renderizarCuadrante();
    if (currentView === "trabajadores") renderTrabajadores();
  }
}

function guardarCuadrante() {
  localStorage.setItem("cuadrante_laboral", JSON.stringify(cuadrante));
}

function cargarCuadrante() {
  const guardado = localStorage.getItem("cuadrante_laboral");
  if (guardado) {
    cuadrante = JSON.parse(guardado);
  } else {
    cuadrante = JSON.parse(JSON.stringify(ORIGINAL_RAW));
  }
}

// ==================== RENDERIZADO ====================
function renderizarCuadrante() {
  const container = document.getElementById("content");
  if (!container) return;
  
  // Aviso de fines de semana
  const avisoHtml = `<div class="aviso">📌 Los días con fondo azul son fines de semana. Toca cualquier celda para editarla.</div>`;
  
  let html = `<div class="wrap"><table><thead><tr><th class="name">Nombre</th>`;
  DAYS.forEach(d => {
    const cls = WEEKENDS.includes(d) ? 'wkend' : '';
    html += `<th class="${cls}">${d}</th>`;
  });
  html += `</tr></thead><tbody>`;
  
  NAMES.forEach((nombre, i) => {
    html += `<tr>`;
    html += `<td class="name">${nombre}</td>`;
    DAYS.forEach((d, j) => {
      const val = cuadrante[i]?.[j] || "";
      let colorClass = "";
      if (val === "L") colorClass = "L";
      else if (val === "D") colorClass = "D";
      else if (val === "F1") colorClass = "F1";
      else if (val === "N") colorClass = "N";
      
      const wkendClass = WEEKENDS.includes(d) ? "wkend" : "";
      html += `<td class="editable-cell ${colorClass} ${wkendClass}" onclick="mostrarModalEdicion(${i},${j},'${val.replace(/'/g, "\\'")}')">${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  container.innerHTML = avisoHtml + html;
}

function renderHome() {
  const ahora = new Date();
  const año = ahora.getFullYear();
  const mes = ahora.getMonth();
  const hoy = ahora.getDate();
  const diasDelMes = new Date(año, mes + 1, 0).getDate();
  
  // Generar calendario
  let calendarioHtml = `<div class="card"><div class="card-header">📅 Calendario de urgencias - Junio 2026</div><div class="card-body"><div class="calendar-grid">`;
  
  const diasSemana = ["L", "M", "M", "J", "V", "S", "D"];
  diasSemana.forEach(d => { calendarioHtml += `<div style="font-weight:600; font-size:11px;">${d}</div>`; });
  
  // Simular primer día de junio 2026 (lunes = 1)
  for (let i = 1; i <= diasDelMes; i++) {
    const eventos = getEventosDelDia(i);
    let color = null;
    if (eventos.some(e => e.urgencia === "rojo")) color = "rojo";
    else if (eventos.some(e => e.urgencia === "amarillo")) color = "amarillo";
    else if (eventos.some(e => e.urgencia === "verde")) color = "verde";
    
    calendarioHtml += `<div class="cal-day"><div class="cal-day-num">${i}</div>${color ? `<div class="cal-dot ${color}"></div>` : ""}</div>`;
  }
  calendarioHtml += `</div></div></div>`;
  
  // Avisos
  const eventosHoy = getEventosDelDia(hoy);
  let avisosHtml = `<div class="card"><div class="card-header">⚠️ Avisos de hoy</div><div class="card-body">`;
  if (eventosHoy.length === 0) {
    avisosHtml += `<p style="color:#64748b;">No hay tareas pendientes para hoy</p>`;
  } else {
    eventosHoy.forEach(e => {
      const colorTexto = e.urgencia === "rojo" ? "urgente-rojo" : (e.urgencia === "amarillo" ? "urgente-amarillo" : "urgente-verde");
      avisosHtml += `<div class="aviso">❗ <strong>${e.nombre}</strong> <span class="${colorTexto}">(${e.urgencia})</span></div>`;
    });
  }
  avisosHtml += `</div></div>`;
  
  const container = document.getElementById("content");
  container.innerHTML = calendarioHtml + avisosHtml;
}

function renderTrabajadores() {
  let html = `<div class="worker-list">`;
  NAMES.forEach((nombre, idx) => {
    const stats = analizarJornadaTrabajador(nombre, idx);
    html += `<div class="worker-item" onclick="verDetalleTrabajador(${idx})">
      <div class="worker-name">${nombre}</div>
      <div class="worker-summary">
        <span>📆 Días trabajados: ${stats.trabajados}</span>
        <span>🔥 Máximo seguidos: ${stats.maxSeguidos}</span>
        <span>📊 Tipos: L=${stats.tipos.L} D=${stats.tipos.D} F1=${stats.tipos.F1} N=${stats.tipos.N}</span>
      </div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById("content").innerHTML = html;
}

function verDetalleTrabajador(idx) {
  const nombre = NAMES[idx];
  const stats = analizarJornadaTrabajador(nombre, idx);
  let mensaje = `${nombre}\n\n`;
  mensaje += `📆 Días trabajados: ${stats.trabajados}\n`;
  mensaje += `🔥 Máximo días seguidos: ${stats.maxSeguidos}\n`;
  mensaje += `📊 Tipos de jornada:\n`;
  mensaje += `   • Libre (L): ${stats.tipos.L}\n`;
  mensaje += `   • Descanso (D): ${stats.tipos.D}\n`;
  mensaje += `   • F1: ${stats.tipos.F1}\n`;
  mensaje += `   • Noche (N): ${stats.tipos.N}\n`;
  mensaje += `   • Otros: ${stats.tipos.otros}\n`;
  
  if (stats.maxSeguidos > 6) {
    mensaje += `\n⚠️ ALERTA: Ha trabajado ${stats.maxSeguidos} días seguidos (recomendación máx 6).\n`;
  }
  
  alert(mensaje);
}

function renderChecklist() {
  let html = `<div class="card"><div class="card-header">✅ Tareas recurrentes (mensuales)</div><div class="card-body">`;
  
  checklist.forEach(tarea => {
    const urgencia = getUrgenciaTarea(tarea);
    let urgenciaTexto = "";
    let urgenciaClase = "";
    if (urgencia === "rojo") { urgenciaTexto = "🔴 Muy urgente"; urgenciaClase = "urgente-rojo"; }
    else if (urgencia === "amarillo") { urgenciaTexto = "🟡 Urgente"; urgenciaClase = "urgente-amarillo"; }
    else if (urgencia === "verde") { urgenciaTexto = "🟢 Poco urgente"; urgenciaClase = "urgente-verde"; }
    else { urgenciaTexto = "✅ Completada"; urgenciaClase = ""; }
    
    const completadaClass = tarea.completada ? "completado" : "";
    html += `<div class="checklist-item ${completadaClass}">
      <div class="checklist-info">
        <div class="checklist-nombre">${tarea.nombre}</div>
        <div class="checklist-fecha">📅 Día ${tarea.dia} de cada mes</div>
        <div class="checklist-urgente ${urgenciaClase}">${urgenciaTexto}</div>
      </div>
      ${!tarea.completada ? `<button class="completado-btn" onclick="completarTarea('${tarea.id}')">Marcar completada</button>` : `<span style="font-size:11px; color:#16a34a;">✔️ Completada este mes</span>`}
    </div>`;
  });
  
  html += `</div></div><div class="card"><div class="card-header">📌 Leyenda</div><div class="card-body"><div style="font-size:12px;">🔴 Rojo: Vence hoy o mañana<br>🟡 Amarillo: Vence en 2-7 días<br>🟢 Verde: Vence en más de 7 días</div></div></div>`;
  document.getElementById("content").innerHTML = html;
}

function mostrarToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

function showView(view) {
  currentView = view;
  document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(`nav-${view}`).classList.add("active");
  
  if (view === "home") renderHome();
  else if (view === "cuadrante") renderizarCuadrante();
  else if (view === "trabajadores") renderTrabajadores();
  else if (view === "checklist") renderChecklist();
}

// ==================== INICIALIZACIÓN ====================
cargarCuadrante();
actualizarChecklistConFecha();

// Exponer funciones globales
window.mostrarModalEdicion = mostrarModalEdicion;
window.completarTarea = completarTarea;
window.verDetalleTrabajador = verDetalleTrabajador;
window.showView = showView;

renderHome();
</script>
