<!DOCTYPE html>
<html lang="es">

<style>

  body { background: #f0f4f8; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #0f172a; overflow: hidden; height: 100dvh; }
  #app { display: flex; flex-direction: column; height: 100dvh; background: #f0f4f8; }

  #header { background: #0f172a; color: #fff; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 10px; }

  #pin-lock-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px; }

  #banner-convenio { background: #dc2626; color: white; padding: 8px 14px; font-size: 12px; text-align: center; font-weight: 600; flex-shrink: 0; }

  #content { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  #nav { display: flex; background: #fff; border-top: 1.5px solid #e2e8f0; flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }

  #nav button .ni { font-size: 20px; display: block; }

  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .card-header { padding: 12px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
  .card-body { padding: 14px 16px; }

  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; font-size: 13px; transition: opacity .15s; width: 100%; margin-bottom: 8px; text-align: center; }
  .btn-primary { background: #0f172a; color: #fff; }
  .btn-secondary { background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f172a; }
  .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .btn-legal { background: #1e40af; color: #fff; }
  .btn-success { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }

  .btn-xs { padding: 4px 8px; border-radius: 8px; font-size: 10px; margin-bottom: 0; width: auto; display: inline-block; }

  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; display: inline-block; }
  .badge-baja { background: #dc2626; color: #fff; }
  .badge-emb { background: #db2777; color: #fff; }

  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-green { background: #dcfce7; color: #14532d; }
  .badge-blue { background: #dbeafe; color: #1e40af; }

  .aviso { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 12px; border-left: 4px solid; }
  .aviso-rojo { background: #fee2e2; border-color: #dc2626; }
  .aviso-amber { background: #fef3c7; border-color: #d97706; }
  .aviso-verde { background: #dcfce7; border-color: #16a34a; }
  .aviso-azul { background: #dbeafe; border-color: #2563eb; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }

  .cal-dot { width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav-btn { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }

  th, td { border: 0.5px solid #cbd5e1; text-align: center; padding: 4px 3px; }

  td.nombre-col { text-align: left; background: #fff; position: sticky; left: 0; z-index: 1; font-weight: 600; }

  th.total-col, td.total-col { min-width: 38px; font-weight: 700; background: #e8f4fd; position: sticky; right: 0; }
  tr:nth-child(even) td { background: #f8fafc; }
  .wkend { background: #eef2ff !important; }
  .festivo-cell { background: #fff7ed !important; }
  .editable-cell { cursor: pointer; }
  .editable-cell:active { background: #dbeafe !important; }
  .baja-row td { opacity: 0.55; background: #fff5f5 !important; }
  .sustituto-row td { color: #dc2626; font-weight: 500; }
  .L { color: #1d4ed8; font-weight: 700; }
  .D { color: #15803d; font-weight: 700; }
  .E { color: #9333ea; font-weight: 700; background: #f3e8ff !important; }
  .F1, .F2, .F3, .F4, .F5, .F6, .F7, .F8, .F9, .F10, .F11, .F12, .F13, .F14, .F15, .F16, .F17, .F18, .F19, .F20, .F21, .F22, .F23, .F24, .F25, .F26, .F27, .F28, .F29, .F30, .F31 { color: #ea580c; font-weight: 700; }
  .N { color: #92400e; font-weight: 700; }
  .M, .T { color: #374151; font-weight: 600; }
  .HE { color: #6d28d9; font-weight: 700; }
  .LIB { color: #0e7490; font-weight: 700; }
  .VAC, .V { color: #065f46; font-weight: 700; background: #d1fae5 !important; }
  .VA { color: #065f46; font-weight: 700; background: #d1fae5 !important; }
  .PR { color: #7c3aed; font-weight: 700; background: #ede9fe !important; }
  .CF { color: #0891b2; font-weight: 700; background: #cffafe !important; }
  .IT { color: #991b1b; font-weight: 700; background: #fee2e2 !important; }
  .LD, .LDA, .LD25, .LD26 { color: #b45309; font-weight: 700; background: #fffbeb !important; }
  .cobertura-row td { background: #f0fdf4; font-weight: 700; color: #15803d; border-top: 2px solid #86efac; }

  .worker-search { width: 100%; padding: 9px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; margin-bottom: 12px; outline: none; }
  .worker-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; cursor: pointer; margin-bottom: 8px; }
  .worker-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .worker-stats { font-size: 11px; color: #64748b; margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .bolsa-pos { color: #16a34a; font-weight: 700; }
  .bolsa-neg { color: #dc2626; font-weight: 700; }
  .vac-bar { height: 5px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .vac-bar-fill { height: 100%; background: #16a34a; border-radius: 3px; }

  .tarea-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .tarea-info { flex: 1; }
  .tarea-nombre { font-weight: 600; font-size: 13px; }
  .tarea-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
  .modal-box { background: #fff; border-radius: 24px 24px 0 0; padding: 22px 20px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; }
  .modal-box.centered { border-radius: 20px; margin: 16px; max-height: 88vh; align-self: center; }
  .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
  .modal-label { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; margin-top: 12px; display: block; }
  .modal-input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; }
  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
  .btn-modal-ok { background: #0f172a; color: #fff; }
  .btn-modal-cancel { background: #f1f5f9; color: #0f172a; }

  .turno-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .turno-btn { padding: 14px 4px; border-radius: 12px; border: 2px solid transparent; font-weight: 800; font-size: 16px; cursor: pointer; text-align: center; }
  .turno-btn:active { transform: scale(0.96); }
  .turno-btn.sel { border-color: #0f172a !important; }
  .tb-L { background: #dbeafe; color: #1d4ed8; }
  .tb-D { background: #dcfce7; color: #15803d; }
  .tb-E { background: #f3e8ff; color: #9333ea; }
  .tb-F1 { background: #ffedd5; color: #ea580c; }
  .tb-N { background: #fef3c7; color: #92400e; }
  .tb-M, .tb-T { background: #f1f5f9; color: #374151; }
  .tb-HE { background: #ede9fe; color: #6d28d9; }
  .tb-LIB { background: #cffafe; color: #0e7490; }
  .tb-VAC, .tb-V, .tb-VA { background: #d1fae5; color: #065f46; }
  .tb-PR { background: #ede9fe; color: #7c3aed; }
  .tb-CF { background: #cffafe; color: #0891b2; }
  .tb-IT { background: #fee2e2; color: #991b1b; }
  .tb-LD, .tb-LDA { background: #fffbeb; color: #b45309; }
  .tb-clear { background: #f1f5f9; color: #94a3b8; }
  .turno-label { font-size: 9px; font-weight: 600; margin-top: 3px; opacity: 0.75; }

  .pin-display { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: #e2e8f0; }
  .pin-dot.filled { background: #0f172a; }
  .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 0 auto; }
  .pin-key { padding: 16px; border-radius: 14px; background: #f1f5f9; border: none; font-size: 20px; font-weight: 700; cursor: pointer; }

  .hist-item { font-size: 11px; padding: 8px 16px; border-bottom: 1px solid #f1f5f9; color: #64748b; }
  
  .zona-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .zona-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .zona-nombre { font-weight: 800; font-size: 14px; }

  .zona-turno-num { font-size: 20px; font-weight: 800; color: #0f172a; }
  .zona-workers { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .num-spinner { display: flex; align-items: center; gap: 6px; justify-content: center; }
  
  .filtro-tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
  .filtro-tab { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px; padding: 5px 12px; font-size: 11px; cursor: pointer; white-space: nowrap; font-weight: 600; flex-shrink: 0; }
  .filtro-tab.active { background: #0f172a; color: #fff; border-color: #0f172a; }

  .zona-check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .zona-check-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; }
  .zona-check-item.selected { background: #dbeafe; border-color: #93c5fd; }
  .zona-check-label { font-size: 12px; font-weight: 600; }
  .zona-check-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; flex-shrink: 0; }
  .zona-check-item.selected .zona-check-dot { background: #2563eb; }

  .eventos-list { max-height: 300px; overflow-y: auto; }
  .evento-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #f1f5f9; }
  .evento-emoji { font-size: 20px; min-width: 40px; text-align: center; }
  .evento-info { flex: 1; }
  .evento-titulo { font-weight: 700; font-size: 13px; }
  .evento-desc { font-size: 11px; color: #64748b; margin-top: 2px; }
  .evento-badge { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 9px; font-weight: 600; }

  .text-area-import { width: 100%; height: 200px; font-family: monospace; font-size: 11px; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; resize: vertical; }
  .text-area-import:focus { outline: none; border-color: #0f172a; }

  .param-list { font-size: 12px; }
  .param-list li { margin-bottom: 6px; padding: 4px; background: #f8fafc; border-radius: 6px; }

  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 500; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .empty { text-align: center; padding: 28px; color: #94a3b8; font-size: 13px; }
  input[type=file] { display: none; }
</style>

<body>
<div id="app">
  <div id="header">
    <div id="header-left">
      <h1>🧹 Gestión Cuadrantes <small>v<span id="version-number">23</span></small></h1>
      <p id="header-sub">Cargando...</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="save-indicator">✓ Guardado</span>
      <button id="pin-lock-btn" onclick="mostrarPantallaPIN('lock')">🔒</button>
    </div>
  </div>
  <div id="banner-convenio" style="background:#dc2626;color:white;padding:8px 14px;font-size:12px;text-align:center;font-weight:600;flex-shrink:0;">⚠️ Convenio vencido. Trabajando en ultraactividad. ⚠️</div>
  <div id="content"></div>
  <nav id="nav">
    <button class="active" onclick="showView('home')"      id="nav-home">     <span class="ni">🏠</span><span class="nl">Inicio</span></button>
    <button onclick="showView('cuadrante')"  id="nav-cuadrante"><span class="ni">📅</span><span class="nl">Cuadrante</span></button>
    <button onclick="showView('personal')"   id="nav-personal"> <span class="ni">👥</span><span class="nl">Personal</span></button>
    <button onclick="showView('zonas')"      id="nav-zonas">    <span class="ni">🏥</span><span class="nl">Zonas</span></button>
    <button onclick="showView('tareas')"     id="nav-tareas">   <span class="ni">✅</span><span class="nl">Tareas</span></button>

  </nav>
</div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".json" onchange="importarBackup(event)">

<script>
// ==================== VERSIÓN Y CONSTANTES ====================
const APP_VERSION = 23;
const MESES_NOMBRES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA = ["D","L","M","X","J","V","S"];
const TURNOS_HABITUALES = ["M","T","N","F1","Rotativo","Sin asignar"];
const ZONA_COLORES = ["#dbeafe","#dcfce7","#fee2e2","#fef3c7","#ede9fe","#cffafe","#fce7f3","#fff7ed"];

function diasEnMes(mes, anio) { return new Date(anio, mes + 1, 0).getDate(); }
function esFinDeSemana(dia, mes, anio) { const dow = new Date(anio, mes, dia).getDay(); return dow === 0 || dow === 6; }

// ==================== FESTIVOS 2026 ====================
const FESTIVOS_DETALLE = {
  "2026-01-01": { nombre: "Año Nuevo", emoji: "🎆", color: "verde" },
  "2026-01-06": { nombre: "Epifanía del Señor", emoji: "👑", color: "verde" },
  "2026-04-02": { nombre: "Jueves Santo", emoji: "⛪", color: "verde" },
  "2026-04-03": { nombre: "Viernes Santo", emoji: "⛪", color: "verde" },
  "2026-04-23": { nombre: "San Jorge · Día de Aragón", emoji: "🐉", color: "verde" },
  "2026-05-01": { nombre: "Fiesta del Trabajo", emoji: "👷", color: "verde" },
  "2026-08-15": { nombre: "Asunción de la Virgen", emoji: "🙏", color: "verde" },
  "2026-10-12": { nombre: "Fiesta Nacional de España", emoji: "🇪🇸", color: "verde" },
  "2026-11-02": { nombre: "Todos los Santos", emoji: "🕯️", color: "verde" },
  "2026-12-07": { nombre: "Día de la Constitución", emoji: "📜", color: "verde" },
  "2026-12-08": { nombre: "Inmaculada Concepción", emoji: "🙏", color: "verde" },
  "2026-12-25": { nombre: "Navidad", emoji: "🎄", color: "verde" },
  "2026-12-24": { nombre: "Nochebuena (festivo convenio)", emoji: "🎅", color: "verde" },
  "2026-12-31": { nombre: "Nochevieja (festivo convenio)", emoji: "🍾", color: "verde" },
  "2026-01-29": { nombre: "San Valero (Zaragoza)", emoji: "🎉", color: "verde" },
  "2026-03-05": { nombre: "Cincomarzada (Zaragoza)", emoji: "⚔️", color: "verde" }
};

function esFestivo(anio, mes, dia) {
  const fechaStr = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  return FESTIVOS_DETALLE.hasOwnProperty(fechaStr);
}

function getNombreFestivo(anio, mes, dia) {
  const fechaStr = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  if (FESTIVOS_DETALLE[fechaStr]) return FESTIVOS_DETALLE[fechaStr];
  return { nombre: "Día festivo", emoji: "🌟", color: "verde" };
}

// ==================== CÓDIGOS DE TURNO ====================
const CODIGOS_TURNO = [
  { cod:"L",   label:"Libre",       horas:0 },
  { cod:"D",   label:"Descanso",    horas:0 },
  { cod:"E",   label:"Exceso",      horas:0 },
  { cod:"M",   label:"Mañana",      horas:7 },
  { cod:"T",   label:"Tarde",       horas:7 },
  { cod:"N",   label:"Noche",       horas:10 },
  { cod:"F1",  label:"Festivo trabajado", horas:0 },
  { cod:"PR",  label:"Permiso Retribuido", horas:0 },
  { cod:"V",   label:"Vacaciones",  horas:0 },
  { cod:"VA",  label:"Vacaciones Antigüedad", horas:0 },
  { cod:"CF",  label:"Conciliación Familiar", horas:0 },
  { cod:"IT",  label:"Incapacidad Temporal", horas:0 },
  { cod:"LD",  label:"Libre Disposición (moscoso)", horas:0 },
  { cod:"LDA", label:"Libre Disposición Antigüedad", horas:0 },
  { cod:"LIB", label:"Libranza",    horas:0 },
  { cod:"HE",  label:"Hora Extra",  horas:0 },
];
function horasCodigo(cod) {
  if (!cod) return 0;
  const num = parseInt(cod);
  if (!isNaN(num) && num >= 2 && num <= 9) return num;
  const entry = CODIGOS_TURNO.find(c => c.cod === cod);
  if (entry) return entry.horas;
  if (cod.startsWith("F")) return 0;
  return 0;
}

// ==================== FUNCIONES EVENTOS ====================
function getEventosDelDia(anio, mes, dia) {
  const fechaStr = `${anio}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  const eventos = [];

  state.tareas.forEach(t => {
    if (!t.completada && t.dia === dia) {
      let prioridad = t.prioridad === "rojo" ? "🔴 Muy urgente" : (t.prioridad === "amber" ? "🟡 Urgente" : "🟢 Poco urgente");
      eventos.push({ tipo: "tarea", nombre: t.nombre, emoji: t.prioridad === "rojo" ? "🔴" : (t.prioridad === "amber" ? "🟡" : "🟢"), descripcion: prioridad, color: t.prioridad });
    }
  });

  if (esFestivo(anio, mes, dia)) {
    const festivo = getNombreFestivo(anio, mes, dia);
    eventos.push({ tipo: "festivo", nombre: festivo.nombre, emoji: festivo.emoji, descripcion: "Día festivo según calendario", color: "verde" });
  }

  state.trabajadores.forEach(t => {
    if (t.eventos) {
      t.eventos.forEach(ev => {
        if (ev.fecha === fechaStr) {
          eventos.push({ tipo: ev.tipo, nombre: t.nombre, emoji: ev.emoji, descripcion: ev.descripcion, color: ev.color });
        }
        if (ev.tipo === "vacaciones" && ev.fechaInicio && ev.fechaFin) {
          const fechaInicio = new Date(ev.fechaInicio);
          const fechaFin = new Date(ev.fechaFin);
          const fechaActual = new Date(fechaStr);
          if (fechaActual >= fechaInicio && fechaActual <= fechaFin) {
            eventos.push({ tipo: "vacaciones", nombre: t.nombre, emoji: "🏖️", descripcion: `Vacaciones (${ev.fechaInicio} al ${ev.fechaFin})`, color: "azul" });
          }
        }
      });
    }
  });

  return eventos;
}

function mostrarEventosDia(anio, mes, dia) {
  const eventos = getEventosDelDia(anio, mes, dia);
  if (eventos.length === 0) { mostrarToast("No hay eventos este día"); return; }
  const fechaStr = `${dia} de ${MESES_NOMBRES[mes]} de ${anio}`;
  let eventosHtml = `<div class="eventos-list">`;
  eventos.forEach(ev => {
    let bgColor = "";
    if (ev.color === "rojo") bgColor = "background:#fee2e2;color:#991b1b";
    else if (ev.color === "amber") bgColor = "background:#fef3c7;color:#92400e";
    else if (ev.color === "verde") bgColor = "background:#dcfce7;color:#14532d";
    else if (ev.color === "azul") bgColor = "background:#dbeafe;color:#1e40af";
    else bgColor = "background:#f1f5f9;color:#64748b";
    eventosHtml += `<div class="evento-item"><div class="evento-emoji">${ev.emoji}</div><div class="evento-info"><div class="evento-titulo">${ev.nombre}</div><div class="evento-desc">${ev.descripcion}</div></div><div class="evento-badge" style="${bgColor}">${ev.tipo === "festivo" ? "Festivo" : (ev.tipo === "tarea" ? "Tarea" : ev.tipo)}</div></div>`;
  });
  eventosHtml += `</div>`;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box centered"><div class="modal-title">📅 ${fechaStr}</div>${eventosHtml}<div class="modal-btns"><button class="btn-modal-cancel" onclick="cerrarModal()">Cerrar</button></div></div>`;
  document.body.appendChild(overlay);
}

// ==================== VALIDACIONES AVANZADAS ====================
function getHorasPorSemana(trabId, mes, anio) {
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return [];
  
  const dias = diasEnMes(mes, anio);
  const semanas = [];
  let semanaActual = [];
  
  for (let d = 0; d < dias; d++) {
    const fecha = new Date(anio, mes, d + 1);
    const diaSemana = fecha.getDay();
    
    semanaActual.push(horasCodigo(cuad[idx][d] || ""));
    
    if (diaSemana === 6 || d === dias - 1) {
      const totalSemana = semanaActual.reduce((a, b) => a + b, 0);
      semanas.push({ semana: semanas.length + 1, total: totalSemana, ok: totalSemana <= state.parametros.jornadaMaxSemanal });
      semanaActual = [];
    }
  }
  return semanas;
}

function validarDescansoNoche(trabId, mes, anio) {
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return [];
  
  const dias = diasEnMes(mes, anio);
  const errores = [];
  
  for (let d = 0; d < dias - 1; d++) {
    const hoy = cuad[idx][d] || "";
    const manana = cuad[idx][d + 1] || "";
    
    if (hoy === "N" && manana !== "L" && manana !== "" && manana !== "D") {
      errores.push(`Día ${d + 1}: Noche (N) sin libranza (L) al día siguiente (tiene ${manana || "vacío"})`);
    }
  }
  return errores;
}

function validarReglasNegocio(trabId, mes, anio) {
  const t = state.trabajadores.find(t => t.id === trabId);
  if (!t || t.estado !== "activo") return [];
  
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return [];
  
  const dias = diasEnMes(mes, anio);
  const errores = [];
  
  for (let d = 0; d < dias; d++) {
    const valor = cuad[idx][d] || "";
    
    if (t.grupo === "manana" && valor === "M") {
      errores.push(`Día ${d + 1}: No debe poner "M" (el blanco ya significa mañana)`);
    }
    
    if (t.grupo === "tarde" && valor === "T") {
      errores.push(`Día ${d + 1}: No debe poner "T" (el blanco ya significa tarde)`);
    }
    
    if (t.grupo === "peon" && valor === "") {
      errores.push(`Día ${d + 1}: Celda vacía - debe poner "M" o "T" explícitamente`);
    }
    
    if (t.grupo === "noche" && valor === "N" && d < dias - 1) {
      const manana = cuad[idx][d + 1] || "";
      if (manana === "N") {
        errores.push(`Día ${d + 1}: Dos noches seguidas (N y N)`);
      }
    }
  }
  
  return errores;
}

function validarCuadranteCompleto() {
  const incidencias = [];
  const mes = state.mesActual;
  const anio = state.anio;
  
  for (const t of state.trabajadores) {
    if (t.estado !== "activo") continue;
    
    const nombre = t.nombre;
    
    const seg = getMaxDiasSeguidos(t.id);
    if (seg > state.parametros.maxDiasSeguidos) {
      incidencias.push(`⚠️ ${nombre}: ${seg} días seguidos trabajando (máx ${state.parametros.maxDiasSeguidos})`);
    }
    
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    if (bolsa < -40) {
      incidencias.push(`📊 ${nombre}: bolsa ${bolsa}h (déficit > 40h)`);
    }
    
    if (t.embarazo) {
      const cuad = getCuadranteMes(mes, anio);
      const idx = state.trabajadores.indexOf(t);
      if (cuad[idx] && cuad[idx].includes("N")) {
        incidencias.push(`🤰 ${nombre}: turno de noche durante embarazo (LPRL)`);
      }
    }
    
    const semanas = getHorasPorSemana(t.id, mes, anio);
    for (const sem of semanas) {
      if (!sem.ok) {
        incidencias.push(`📅 ${nombre}: semana ${sem.semana} excede ${state.parametros.jornadaMaxSemanal}h (${sem.total}h)`);
      }
    }
    
    const nocheErrores = validarDescansoNoche(t.id, mes, anio);
    for (const err of nocheErrores) {
      incidencias.push(`🌙 ${nombre}: ${err}`);
    }
    
    const negocioErrores = validarReglasNegocio(t.id, mes, anio);
    for (const err of negocioErrores) {
      incidencias.push(`📋 ${nombre}: ${err}`);
    }
  }
  
  return incidencias;
}

// ==================== FUNCIONES CUADRANTE ====================
function clavesMes(mes, anio) { return `${anio}-${mes}`; }

function getCuadranteMes(mes, anio) {
  const key = clavesMes(mes, anio);
  if (!state.cuadrantePorMes[key]) {
    const dias = diasEnMes(mes, anio);
    state.cuadrantePorMes[key] = state.trabajadores.map(() => Array(dias).fill(""));
  }
  return state.cuadrantePorMes[key];
}

function setCelda(trabId, dia, valor, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx === -1) return;
  const anterior = cuad[idx]?.[dia] ?? "";
  undoStack.push({ trabId, dia, mes, anio, anterior, nuevo: valor });
  if (undoStack.length > 20) undoStack.shift();
  state.historial.unshift({ ts: Date.now(), trabId, mes, anio, dia, anterior, nuevo: valor });
  if (state.historial.length > 200) state.historial.pop();
  if (!cuad[idx]) cuad[idx] = [];
  cuad[idx][dia] = valor;
  guardarDatos();
  if (currentView === "cuadrante") actualizarCeldaEnTabla(idx, dia, valor);
}

function actualizarCeldaEnTabla(fila, columna, valor) {
  const celda = document.getElementById(`celda-${fila}-${columna}`);
  if (celda) {
    celda.textContent = valor;
    let colorClass = "";
    if (valor === "L") colorClass = "L";
    else if (valor === "D") colorClass = "D";
    else if (valor === "E") colorClass = "E";
    else if (valor === "M") colorClass = "M";
    else if (valor === "T") colorClass = "T";
    else if (valor === "N") colorClass = "N";
    else if (valor === "HE") colorClass = "HE";
    else if (valor === "LIB") colorClass = "LIB";
    else if (valor === "V" || valor === "VAC") colorClass = "V";
    else if (valor === "VA") colorClass = "VA";
    else if (valor === "PR") colorClass = "PR";
    else if (valor === "CF") colorClass = "CF";
    else if (valor === "IT") colorClass = "IT";
    else if (valor === "LD" || valor === "LDA") colorClass = "LD";
    else if (valor && valor.startsWith("F")) colorClass = "F1";
    celda.className = `editable-cell ${colorClass} ${celda.classList.contains("wkend") ? "wkend" : ""} ${celda.classList.contains("festivo-cell") ? "festivo-cell" : ""}`;
    const totalCelda = document.getElementById(`total-${fila}`);
    if (totalCelda) totalCelda.textContent = getTotalHorasMes(state.trabajadores[fila].id, state.mesActual, state.anio);
  }
}

function moverTrabajador(idx, direccion) {
  const nuevoIdx = direccion === 'up' ? idx - 1 : idx + 1;
  if (nuevoIdx < 0 || nuevoIdx >= state.trabajadores.length) return;
  const tempTrabajador = state.trabajadores[idx];
  state.trabajadores[idx] = state.trabajadores[nuevoIdx];
  state.trabajadores[nuevoIdx] = tempTrabajador;
  Object.keys(state.cuadrantePorMes).forEach(key => {
    const cuad = state.cuadrantePorMes[key];
    if (cuad && cuad[idx] && cuad[nuevoIdx]) {
      const tempFila = cuad[idx];
      cuad[idx] = cuad[nuevoIdx];
      cuad[nuevoIdx] = tempFila;
    }
  });
  guardarDatos();
  if (currentView === "cuadrante") renderCuadrante();
  mostrarToast(`${direccion === 'up' ? '⬆️' : '⬇️'} ${state.trabajadores[nuevoIdx].nombre} movido ${direccion === 'up' ? 'arriba' : 'abajo'}`);
}

function getTotalHorasMes(trabId, mes, anio) {
  const cuad = getCuadranteMes(mes ?? state.mesActual, anio ?? state.anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return 0;
  return cuad[idx].reduce((s, v) => s + horasCodigo(v), 0);
}

function getTotalHorasAnio(trabId, anio) {
  anio = anio ?? state.anio;
  let total = 0;
  for (let m = 0; m < 12; m++) total += getTotalHorasMes(trabId, m, anio);
  return total;
}

function getVacacionesDisfrutadas(trabId, anio) {
  anio = anio ?? state.anio;
  let dias = 0;
  for (let m = 0; m < 12; m++) {
    const cuad = getCuadranteMes(m, anio);
    const idx = state.trabajadores.findIndex(t => t.id === trabId);
    if (idx < 0 || !cuad[idx]) continue;
    dias += cuad[idx].filter(v => v === "V" || v === "VAC" || v === "VA").length;
  }
  return dias;
}

function getMaxDiasSeguidos(trabId, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  let prefijo = [];
  if (mes > 0) {
    const mesAnt = mes - 1;
    const diasAnt = diasEnMes(mesAnt, anio);
    const cuadAnt = getCuadranteMes(mesAnt, anio);
    const idx = state.trabajadores.findIndex(t => t.id === trabId);
    if (idx >= 0 && cuadAnt[idx]) {
      for (let d = Math.max(0, diasAnt - 6); d < diasAnt; d++) prefijo.push(cuadAnt[idx][d] || "");
    }
  }
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  const fila = (idx >= 0 && cuad[idx]) ? cuad[idx] : [];
  const todos = [...prefijo, ...fila];
  let max = 0, actual = 0;
  for (const v of todos) {
    const trabajado = v && v !== "L" && v !== "D" && v !== "V" && v !== "VAC" && v !== "VA" && v !== "";
    if (trabajado) { actual++; max = Math.max(max, actual); }
    else actual = 0;
  }
  return max;
}

function haTrabajado(trabId, mes, anio) {
  const cuad = getCuadranteMes(mes ?? state.mesActual, anio ?? state.anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx < 0 || !cuad[idx]) return false;
  return cuad[idx].some(v => v && v !== "L" && v !== "D" && v !== "");
}

function coberturaDelDia(dia, mes, anio) {
  const cuad = getCuadranteMes(mes ?? state.mesActual, anio ?? state.anio);
  const result = { M: 0, T: 0, N: 0 };
  state.trabajadores.forEach((t, idx) => {
    if (t.estado === "baja") return;
    const v = cuad[idx]?.[dia] || "";
    if (t.grupo === "manana" && v === "") result.M++;
    else if (t.grupo === "tarde" && v === "") result.T++;
    else if (v === "M") result.M++;
    else if (v === "T") result.T++;
    else if (v === "N") result.N++;
  });
  return result;
}

      else if (val === "PR") estilo += " color:#7c3aed;font-weight:700;background:#ede9fe;";
      else if (val === "CF") estilo += " color:#0891b2;font-weight:700;background:#cffafe;";
      else if (val === "IT") estilo += " color:#991b1b;font-weight:700;background:#fee2e2;";
      else if (val === "LD" || val === "LDA") estilo += " color:#b45309;font-weight:700;background:#fffbeb;";
      else if (val && val.startsWith("F")) estilo += " color:#ea580c;font-weight:700;";
      else if (val === "") estilo += " color:#374151;";
      tablaHtml += `<td style="${estilo}">${val === "" && t.turnoBase === "M" ? "" : val}</td>`;
    }
    tablaHtml += `<td style="border:0.5px solid #000;padding:4px;text-align:center;font-weight:700;background:#e8f4fd;">${total}</td>`;
  }

// ==================== PIN ====================
function hashSimple(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
  return h.toString(36);
}

function mostrarPantallaPIN(modo) {
  if (modo === "lock") { pinDesbloqueado = false; mostrarPantallaPIN("unlock"); return; }
  if (!state.pinHash && modo === "unlock") { pinDesbloqueado = true; return; }
  let entrada = "";
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box centered" style="max-width:320px;text-align:center"><div class="modal-title">${modo === "setup" ? "Crear PIN" : "🔒 Introduce tu PIN"}</div><div class="pin-display" id="pd">${[0,1,2,3].map(() => '<div class="pin-dot"></div>').join("")}</div><div class="pin-keypad">${[1,2,3,4,5,6,7,8,9,"","0","⌫"].map(k => k === "" ? `<div></div>` : `<button class="pin-key" onclick="pinTecla('${k}')">${k}</button>`).join("")}</div><button onclick="cerrarModal()" style="margin-top:14px;background:none;border:none;color:#94a3b8">Cancelar</button></div>`;
  document.body.appendChild(overlay);
  overlay.dataset.pinModo = modo;
  overlay.dataset.pinEtapa = "1";
  overlay.dataset.pinPrimero = "";
  window.pinTecla = function(k) {
    if (k === "⌫") entrada = entrada.slice(0, -1);
    else if (entrada.length < 4) entrada += k;
    const dots = document.querySelectorAll(".pin-dot");
    dots.forEach((d, i) => d.classList.toggle("filled", i < entrada.length));
    if (entrada.length !== 4) return;
    setTimeout(() => {
      if (modo === "unlock") {
        if (hashSimple(entrada) === state.pinHash) { pinDesbloqueado = true; cerrarModal(); mostrarToast("✅ Desbloqueada"); render(); }
        else { entrada = ""; dots.forEach(d => d.classList.remove("filled")); mostrarToast("❌ PIN incorrecto", true); }
      } else if (modo === "setup") {
        if (overlay.dataset.pinEtapa === "1") {
          overlay.dataset.pinPrimero = entrada;
          overlay.dataset.pinEtapa = "2";
          entrada = "";
          dots.forEach(d => d.classList.remove("filled"));
          overlay.querySelector(".modal-title").textContent = "Confirma el PIN";
        } else {
          if (entrada === overlay.dataset.pinPrimero) {
            state.pinHash = hashSimple(entrada);
            pinDesbloqueado = true;
            guardarDatos(); cerrarModal(); mostrarToast("✅ PIN configurado");
          } else {
            overlay.dataset.pinEtapa = "1";
            entrada = "";
            dots.forEach(d => d.classList.remove("filled"));
            overlay.querySelector(".modal-title").textContent = "Crear PIN";
            mostrarToast("❌ Los PIN no coinciden", true);
          }
        }
      }
    }, 120);
  };
}

    const fds = esFinDeSemana(d, mes, anio);
    const fest = esFestivo(anio, mes, d);
    html += `<th style="border:0.5px solid #cbd5e1;padding:6px 2px;text-align:center;${fds ? 'background:#eef2ff;' : ''}${fest ? 'background:#fff7ed;' : ''}">${d}</th>`;
  }
  html += `<th style="border:0.5px solid #cbd5e1;padding:6px 4px;text-align:center;background:#e8f4fd;position:sticky;right:0;">H</th><th style="border:0.5px solid #cbd5e1;padding:6px 4px;text-align:center;background:#f1f5f9;position:sticky;right:0;min-width:50px;">Mover</th></thead><tbody>`;
  
  // ===== FILAS DE TRABAJADORES =====
  for (let f = 0; f < filtrados.length; f++) {
    const t = filtrados[f];
    const idxOriginal = indicesFiltrados[f];
    const total = getTotalHorasMes(t.id, mes, anio);
    const seg = getMaxDiasSeguidos(t.id, mes, anio);
    const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
    const esSustituto = t.tipo === "sustituto";
    const esInactivo = t.estado === "inactivo";
    
    let rowStyle = "";
    if (t.estado === "baja") rowStyle = "opacity:0.55; background:#fff5f5;";
    if (esSustituto) rowStyle = "color:#dc2626;";
    if (esInactivo) rowStyle = "opacity:0.55; background:#fff5f5;";
    
    html += `<tr style="${rowStyle}"><td style="border:0.5px solid #cbd5e1;padding:4px 6px;text-align:left;position:sticky;left:0;background:white;font-weight:600;">${t.nombre}${t.estado === "baja" ? ' <span class="badge badge-baja" style="margin-left:4px">BAJA</span>' : ''}${t.tipo === "sustituto" ? ' <span class="badge badge-sustituto" style="margin-left:4px">SUSTITUTO</span>' : ''}${t.embarazo ? " 🤰" : ""}${seg > state.parametros.maxDiasSeguidos ? " ⚠️" : ""}${bolsa < -40 ? " 📉" : ""}</td>`;
    
    // Bucle de días (todas las celdas del trabajador)
    for (let d = 0; d < dias; d++) {
      let val = cuad[idxOriginal]?.[d] || "";
      if (val === "" && t.turnoBase === "M" && t.estado === "activo") val = "";
      
      let cellStyle = "border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;";
      if (val === "L") cellStyle += " color:#1d4ed8;font-weight:700;";
      else if (val === "D") cellStyle += " color:#15803d;font-weight:700;";
      else if (val === "E") cellStyle += " color:#9333ea;font-weight:700;background:#f3e8ff;";
      else if (val === "M") cellStyle += " color:#374151;font-weight:600;";
      else if (val === "T") cellStyle += " color:#374151;font-weight:600;";
      else if (val === "N") cellStyle += " color:#92400e;font-weight:700;";
      else if (val === "HE") cellStyle += " color:#6d28d9;font-weight:700;";
      else if (val === "LIB") cellStyle += " color:#0e7490;font-weight:700;";
      else if (val === "V" || val === "VAC") cellStyle += " color:#065f46;font-weight:700;background:#d1fae5;";
      else if (val === "VA") cellStyle += " color:#065f46;font-weight:700;background:#d1fae5;";
      else if (val === "PR") cellStyle += " color:#7c3aed;font-weight:700;background:#ede9fe;";
      else if (val === "CF") cellStyle += " color:#0891b2;font-weight:700;background:#cffafe;";
      else if (val === "IT") cellStyle += " color:#991b1b;font-weight:700;background:#fee2e2;";
      else if (val === "LD" || val === "LDA") cellStyle += " color:#b45309;font-weight:700;background:#fffbeb;";
      else if (val && val.startsWith("F")) cellStyle += " color:#ea580c;font-weight:700;";
      
      const fds = esFinDeSemana(d + 1, mes, anio);
      const fest = esFestivo(anio, mes, d + 1);
      if (fds) cellStyle += " background:#eef2ff;";
      if (fest && val && val !== "L" && val !== "D") cellStyle += " background:#fff7ed;";
      
      const fechaCelda = new Date(anio, mes, d + 1);
      const diff = Math.ceil((fechaCelda - new Date()) / 86400000);
      const preaviso = diff > 0 && diff <= state.parametros.preavisoDias;
      if (preaviso) cellStyle += " border-bottom:2px solid #d97706;";
      
      // VALIDACIONES ESPECÍFICAS (resaltar celdas con error)
      let tieneError = false;
      // Regla 1: Trabajadores de mañana no deben tener M explícito
      if (t.grupo === "manana" && val === "M") tieneError = true;
      // Regla 2: Trabajadores de tarde no deben tener T explícito
      if (t.grupo === "tarde" && val === "T") tieneError = true;
      // Regla 3: Peones no deben tener celda vacía
      if (t.grupo === "peon" && val === "") tieneError = true;
      // Regla 4: Noche sin libranza al día siguiente
      if (t.grupo === "noche" && val === "N" && d < dias - 1) {
        const manana = cuad[idxOriginal]?.[d + 1] || "";
        if (manana !== "L" && manana !== "" && manana !== "D") tieneError = true;
      }
      
      if (tieneError) cellStyle += " background:#fee2e2 !important; border-left:3px solid #dc2626 !important;";
      
      // CELDA CORRECTA - CIERRE CON `</td>`
      html += `<td style="${cellStyle}" onclick="abrirSelectorTurno('${t.id}',${d})">${val === "" && t.turnoBase === "M" ? "" : val}${fest && val && val !== "L" && val !== "D" && val !== "V" && val !== "VAC" && val !== "VA" ? '🌟' : ''}</td>`;
    }
    
    // Total y botones de mover (después del bucle de días)
    html += `<td style="border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;font-weight:700;background:#e8f4fd;position:sticky;right:0;">${total}</td>`;
    html += `<td style="border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;background:#f1f5f9;position:sticky;right:0;min-width:50px;"><div style="display:flex;flex-direction:column;gap:2px;"><button class="btn-xs" style="padding:2px 6px;font-size:12px;background:#0f172a;color:white;border:none;border-radius:4px;cursor:pointer;" onclick="moverTrabajador(${idxOriginal}, 'up')" ${f === 0 ? 'disabled style="opacity:0.3;"' : ''}>↑</button><button class="btn-xs" style="padding:2px 6px;font-size:12px;background:#0f172a;color:white;border:none;border-radius:4px;cursor:pointer;" onclick="moverTrabajador(${idxOriginal}, 'down')" ${f === filtrados.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>↓</button></div></td>`;
    
    // ✅ CIERRE DE FILA CORRECTO (después de todas las celdas del trabajador)
    html += `</tr>`;
  }
  
  // Fila de cobertura
  html += `<tr style="background:#f0fdf4;font-weight:700;"><td style="border:0.5px solid #cbd5e1;padding:4px 6px;text-align:left;position:sticky;left:0;background:#f0fdf4;">Cobertura M/T/N<\/td>`;
  for (let d = 0; d < dias; d++) {
    const cob = coberturaDelDia(d, mes, anio);
    let deficit = false;
    for (const zona of state.zonas) {
      if ((zona.coberturaMin?.M > 0 && (cob.M || 0) < zona.coberturaMin.M) || (zona.coberturaMin?.T > 0 && (cob.T || 0) < zona.coberturaMin.T) || (zona.coberturaMin?.N > 0 && (cob.N || 0) < zona.coberturaMin.N)) deficit = true;
    }
    html += `<td style="${deficit ? "border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;background:#fee2e2;color:#dc2626;" : "border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;"}">${cob.M}/${cob.T}/${cob.N}<\/td>`;
  }
  html += `<td style="border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;background:#f0fdf4;"><\/td><td style="border:0.5px solid #cbd5e1;padding:4px 2px;text-align:center;background:#f0fdf4;"><\/td>`;
  html += `<\/tr>`;
  html += `</tbody>`;
  html += `<\/table>`;
  html += `</div>`;
  
  document.getElementById("content").innerHTML = html;
  document.getElementById("header-sub").textContent = `${MESES_NOMBRES[mes]} ${anio}`;
}

function abrirSelectorTurno(trabId, dia) {
  const t = state.trabajadores.find(t => t.id === trabId);
  const valorActual = getCuadranteMes(state.mesActual, state.anio)[state.trabajadores.indexOf(t)]?.[dia] || "";
  const fechaCelda = new Date(state.anio, state.mesActual, dia + 1);
  const diff = Math.ceil((fechaCelda - new Date()) / 86400000);
  if (diff > 0 && diff <= state.parametros.preavisoDias && !confirm(`⚠️ Preaviso legal (${state.parametros.preavisoDias} días). ¿Modificar igualmente?`)) return;
  const esFest = esFestivo(state.anio, state.mesActual, dia + 1);
  let festivoMsg = "";
  if (esFest && valorActual && valorActual !== "L" && valorActual !== "D") {
    const festInfo = getNombreFestivo(state.anio, state.mesActual, dia + 1);
    festivoMsg = `\n⚠️ ATENCIÓN: ${festInfo.nombre}. Si se trabaja, genera derecho a descanso compensatorio y paga extra (59.34 €).`;
  }
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">Turno — ${t.nombre.split(" ")[0]} · día ${dia+1}${esFest ? ' 🌟 FESTIVO' : ''}</div><div class="turno-grid">${CODIGOS_TURNO.map(c => `<div><button class="turno-btn tb-${c.cod === "F1" ? "F1" : (c.cod === "V" ? "V" : c.cod === "VA" ? "VA" : c.cod === "PR" ? "PR" : c.cod === "CF" ? "CF" : c.cod === "IT" ? "IT" : c.cod === "LD" ? "LD" : c.cod === "LDA" ? "LDA" : c.cod === "LIB" ? "LIB" : c.cod === "HE" ? "HE" : (c.cod === "E" ? "E" : (c.cod || "clear")))}${valorActual === c.cod ? " sel" : ""}" onclick="seleccionarTurno('${trabId}',${dia},'${c.cod}')">${c.cod || "✕"}</button><div class="turno-label">${c.label}</div></div>`).join("")}</div><div style="display:flex;gap:8px;margin-top:8px"><input id="turno-manual" class="modal-input" placeholder="O escribe: 2-9, F2-F31, LD25, LD26, V25..." style="flex:1"><button class="btn btn-primary btn-sm" onclick="seleccionarTurnoManual('${trabId}',${dia})">OK</button></div>${festivoMsg ? `<p style="font-size:11px;color:#d97706;margin-top:8px">${festivoMsg}</p>` : ""}<button onclick="cerrarModal()" class="btn btn-secondary" style="margin-top:10px">Cancelar</button></div>`;
  document.body.appendChild(overlay);

function undoUltimoCambio() {
  if (!undoStack.length) { mostrarToast("No hay cambios que deshacer"); return; }
  const { trabId, dia, mes, anio, anterior } = undoStack.pop();
  const cuad = getCuadranteMes(mes, anio);
  const idx = state.trabajadores.findIndex(t => t.id === trabId);
  if (idx >= 0 && cuad[idx]) cuad[idx][dia] = anterior;
  guardarDatos();
  if (currentView === "cuadrante") actualizarCeldaEnTabla(idx, dia, anterior);
  mostrarToast("↩ Cambio deshecho");
}

// ==================== IMPORTADOR POR NOMBRE (MEJORADO) ====================
function importarPorNombre(textoExcel, mes, anio) {
  mes = mes ?? state.mesActual;
  anio = anio ?? state.anio;
  const dias = diasEnMes(mes, anio);

  const CODIGOS_VALIDOS = new Set([
    'M','T','N','L','D','E','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10',
    'F11','F12','F13','F14','F15','F16','F17','F18','F19','F20','F21','F22','F23',
    'F24','F25','F26','F27','F28','F29','F30','F31',
    'PR','V','VA','CF','IT','LD','LDA','LIB','HE','VAC',
    'LD25','LD26','L24','D25','L25','D26',''
  ]);

  const esCodigo = v => {
    if (CODIGOS_VALIDOS.has(v)) return true;
    if (/^F\d+$/.test(v)) return true;
    if (/^[A-Z]{1,4}\d{0,2}$/.test(v) && v.length <= 5) return true;
    if (/^\d$/.test(v)) return true;
    return false;
  };

  const normalizar = s => s.normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Z0-9 ]/g, '')
    .replace(/\s+/g, ' ').trim().toUpperCase();

  const scoreNombre = (a, b) => {
    const an = normalizar(a), bn = normalizar(b);
    if (an === bn) return 100;
    const pa = an.split(' ').filter(p => p.length >= 3);
    const pb = bn.split(' ').filter(p => p.length >= 3);
    if (!pa.length || !pb.length) return 0;
    const coinciden = pa.filter(p => pb.includes(p)).length;
    const bonusApellido = pa[pa.length-1] === pb[pb.length-1] ? 15 : 0;
    return Math.round(coinciden / Math.max(pa.length, pb.length) * 100) + bonusApellido;
  };

  const lineas = textoExcel.trim().split(/\r?\n/).filter(l => l.trim());
  const resultado = {};
  const log = [];

  lineas.forEach((linea, i) => {
    const cols = linea.split(/\t/).map(c => c.trim());

    let nombreIdx = -1, nombre = '';
    for (let c = 0; c < cols.length; c++) {
      const v = cols[c];
      if (
        v.length >= 3 &&
        !esCodigo(v.toUpperCase()) &&
        !/^\d+$/.test(v) &&
        /[A-Za-záéíóúñÁÉÍÓÚÑ]{3,}/.test(v)
      ) {
        nombreIdx = c;
        nombre = v.toUpperCase().trim();
        break;
      }
    }
    if (nombreIdx === -1) return;

    const resto = cols.slice(nombreIdx + 1);
    const turnos = [];
    for (let r = 0; r < resto.length; r++) {
      const v = resto[r].toUpperCase();
      if (v.length > 6 && !esCodigo(v) && !/^\d+$/.test(v)) break;
      turnos.push(resto[r].trim());
      if (turnos.length === dias) break;
    }

    while (turnos.length < dias) turnos.push('');

    let mejor = null, mejorScore = 0;
    state.trabajadores.forEach(t => {
      const s = scoreNombre(nombre, t.nombre);
      if (s > mejorScore) { mejorScore = s; mejor = t; }
    });

    if (mejor && mejorScore >= 40) {
      resultado[mejor.id] = turnos.slice(0, dias);
      log.push(`✓ (${mejorScore}%) ${nombre} → ${mejor.nombre}`);
    } else {
      log.push(`✗ SIN MATCH: ${nombre} (mejor: ${mejor?.nombre || '?'} ${mejorScore}%)`);
    }
  });

  const key = clavesMes(mes, anio);
  if (!state.cuadrantePorMes[key])
    state.cuadrantePorMes[key] = state.trabajadores.map(() => Array(dias).fill(''));
  const cuad = state.cuadrantePorMes[key];

  let aplicados = 0;
  state.trabajadores.forEach((t, idx) => {
    if (resultado[t.id]) { cuad[idx] = resultado[t.id]; aplicados++; }
  });

  console.log(log.join('\n'));
  guardarDatos();
  if (currentView === 'cuadrante') renderCuadrante();
  const sinMatch = log.filter(l => l.startsWith('✗')).length;
  mostrarToast(`✅ Importados ${aplicados} trabajadores` + (sinMatch ? ` · ${sinMatch} sin match (ver consola)` : ''));
  return { aplicados, log };
}

      <p style="font-size:12px; color:#64748b; margin-bottom:8px;">📌 Este método NO depende del orden de las filas. Busca automáticamente por nombre.</p>
      <p style="font-size:12px; color:#64748b; margin-bottom:8px;">1. En Excel, selecciona las filas con nombres y turnos (columna nombre + días).</p>

  const texto = document.getElementById("excel-data-nombre")?.value || "";

function renderPersonal() {
  const mes = state.mesActual, anio = state.anio;
  let html = `<input class="worker-search" id="worker-search" type="text" placeholder="🔍 Buscar por nombre..." value="${personalFiltro}" onkeyup="personalFiltroChange(this.value)">`;
  html += `<div class="filtro-tabs"><button class="filtro-tab${personalFiltroZona==="todas"?" active":""}" onclick="setFiltroZona('todas')">Todas</button>`;
  state.zonas.forEach(z => html += `<button class="filtro-tab${personalFiltroZona===z.id?" active":""}" onclick="setFiltroZona('${z.id}')">${z.nombre}</button>`);
  html += `<button class="filtro-tab${personalFiltroZona==="sin"?" active":""}" onclick="setFiltroZona('sin')">Sin zona</button></div>`;
  html += `<div class="filtro-tabs"><button class="filtro-tab${personalFiltroTurno==="todos"?" active":""}" onclick="setFiltroTurno('todos')">Todos los turnos</button>`;
  TURNOS_HABITUALES.forEach(t => html += `<button class="filtro-tab${personalFiltroTurno===t?" active":""}" onclick="setFiltroTurno('${t}')">${t}</button>`);
  html += `</div>`;
  let filtrados = state.trabajadores.filter(t => {
    if (personalFiltro && !t.nombre.toLowerCase().includes(personalFiltro.toLowerCase())) return false;
    if (personalFiltroZona !== "todas") {
      if (personalFiltroZona === "sin") { if (t.zonaPrincipalId) return false; }
      else if (t.zonaPrincipalId !== personalFiltroZona) return false;
    }
    if (personalFiltroTurno !== "todos" && t.turnoHabitual !== personalFiltroTurno) return false;
    return true;
  });
  const trabajan = filtrados.filter(t => haTrabajado(t.id, mes, anio));
  const noTrabajan = filtrados.filter(t => !haTrabajado(t.id, mes, anio));
  html += `<div style="font-size:12px;color:#64748b;margin-bottom:10px">${filtrados.length} trabajadores · ${trabajan.length} han trabajado · ${noTrabajan.length} no han trabajado</div>`;
  html += `<div class="card"><div class="card-header">✅ Han trabajado este mes (${trabajan.length})</div><div class="card-body">`;
  trabajan.forEach(t => html += cardWorkerHtml(t, mes, anio));

  document.getElementById("content").innerHTML = html;
  
  const searchInput = document.getElementById("worker-search");
  if (searchInput && personalFiltro) {
    searchInput.value = personalFiltro;
  }
}

function cardWorkerHtml(t, mes, anio) {
  const horas = getTotalHorasMes(t.id, mes, anio);
  const bolsa = getTotalHorasAnio(t.id) - state.parametros.jornadaAnualDiurna;
  const seg = getMaxDiasSeguidos(t.id, mes, anio);
  const vacDis = getVacacionesDisfrutadas(t.id);
  const vacTot = t.vacacionesTotales || 22;
  const vacPct = Math.min(100, Math.round(vacDis / vacTot * 100));
  return `<div class="worker-item" onclick="modalDetalleWorker('${t.id}')"><div class="worker-name">${t.nombre}${t.estado === "baja" ? '<span class="badge badge-baja">BAJA</span>' : ""}${t.embarazo ? '<span class="badge badge-emb">🤰</span>' : ""}${t.tipo === "sustituto" ? '<span class="badge badge-sustituto">SUSTITUTO</span>' : ""}</div><div class="worker-stats"><span>📅 ${horas}h mes</span><span class="${bolsa >= 0 ? "bolsa-pos" : "bolsa-neg"}">${bolsa >= 0 ? "+" : ""}${bolsa}h bolsa</span><span>🔄 ${seg} días</span><span>🏖 ${vacDis}/${vacTot}</span><span>📅 ${t.antiguedadAnios || 0} años</span></div><div class="vac-bar"><div class="vac-bar-fill" style="width:${vacPct}%"></div></div></div>`;
}

function setFiltroZona(val) { personalFiltroZona = val; renderPersonal(); }
function setFiltroTurno(val) { personalFiltroTurno = val; renderPersonal(); }
function personalFiltroChange(val) { personalFiltro = val; renderPersonal(); }

function modalDetalleWorker(id) {
  const t = state.trabajadores.find(t => t.id === id);
  if (!t) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">✏️ ${t.nombre}</div><label class="modal-label">Nombre</label><input class="modal-input" id="dw-nombre" value="${t.nombre}"><label class="modal-label">Estado</label><select class="modal-input" id="dw-estado"><option value="activo" ${t.estado==="activo"?"selected":""}>Activo</option><option value="baja" ${t.estado==="baja"?"selected":""}>Baja</option><option value="inactivo" ${t.estado==="inactivo"?"selected":""}>Inactivo (sustituto)</option></select><label class="modal-label">Turno base</label><select class="modal-input" id="dw-turnoBase"><option value="M" ${t.turnoBase==="M"?"selected":""}>Mañanas (en blanco)</option><option value="T" ${t.turnoBase==="T"?"selected":""}>Tardes</option><option value="N" ${t.turnoBase==="N"?"selected":""}>Noches</option><option value="Rotativo" ${t.turnoBase==="Rotativo"?"selected":""}>Rotativo (peones)</option></select><div style="margin-top:12px"><label><input type="checkbox" id="dw-emb" ${t.embarazo?"checked":""}> 🤰 Embarazo</label></div><div class="modal-btns"><button class="btn-modal-ok" onclick="guardarWorker('${id}')">Guardar</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div><button class="btn btn-danger" style="margin-top:8px" onclick="iniciarBajaWorker('${id}')">🩺 Registrar baja</button><button class="btn btn-danger" style="margin-top:4px" onclick="eliminarTrabajador('${id}')">🗑 Eliminar</button></div>`;
  document.body.appendChild(overlay);
}

function guardarWorker(id) {
  const t = state.trabajadores.find(t => t.id === id);
  if (!t) return;
  t.nombre = document.getElementById("dw-nombre")?.value?.trim() || t.nombre;
  t.estado = document.getElementById("dw-estado")?.value || t.estado;
  t.turnoBase = document.getElementById("dw-turnoBase")?.value || t.turnoBase;
  t.grupo = t.turnoBase === "T" ? "tarde" : t.turnoBase === "N" ? "noche" : t.turnoBase === "Rotativo" ? "peon" : "manana";
  t.embarazo = document.getElementById("dw-emb")?.checked || false;
  guardarDatos(); cerrarModal(); renderPersonal();
  if (currentView === "cuadrante") renderCuadrante();
  mostrarToast(`✅ ${t.nombre.split(" ")[0]} actualizado`);
}

function eliminarTrabajador(id) {
  if (!confirm("¿Eliminar este trabajador?")) return;
  const idx = state.trabajadores.findIndex(t => t.id === id);
  if (idx === -1) return;
  state.trabajadores.splice(idx, 1);
  Object.keys(state.cuadrantePorMes).forEach(key => { if (state.cuadrantePorMes[key][idx]) state.cuadrantePorMes[key].splice(idx, 1); });
  guardarDatos(); renderPersonal(); renderCuadrante();
  mostrarToast("🗑 Trabajador eliminado");
}

function modalNuevoTrabajador() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">➕ Nuevo trabajador</div><label class="modal-label">Nombre</label><input class="modal-input" id="nt-nombre"><label class="modal-label">Tipo</label><select class="modal-input" id="nt-tipo"><option value="fijo">Fijo</option><option value="sustituto">Sustituto</option></select><label class="modal-label">Turno base</label><select class="modal-input" id="nt-turnoBase"><option value="M">Mañanas</option><option value="T">Tardes</option><option value="N">Noches</option><option value="Rotativo">Rotativo</option></select><div class="modal-btns"><button class="btn-modal-ok" onclick="crearWorker()">Añadir</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div></div>`;
  document.body.appendChild(overlay);
}

function crearWorker() {
  const nombre = document.getElementById("nt-nombre")?.value?.trim();
  const tipo = document.getElementById("nt-tipo")?.value || "fijo";
  const turnoBase = document.getElementById("nt-turnoBase")?.value || "M";
  if (!nombre) { mostrarToast("❌ Nombre requerido", true); return; }
  const id = `t_${Date.now()}`;
  let grupo = "manana";
  if (turnoBase === "T") grupo = "tarde";
  else if (turnoBase === "N") grupo = "noche";
  else if (turnoBase === "Rotativo") grupo = "peon";
  state.trabajadores.push({ id, nombre, tipo, turnoBase, grupo, estado: tipo === "sustituto" ? "inactivo" : "activo", embarazo: false, zonaPrincipalId: "", zonasRotacionIds: [], turnoHabitual: turnoBase === "Rotativo" ? "Rotativo" : turnoBase, notas: "", vacacionesTotales: 22, fechaBaja: null, eventos: [], antiguedadAnios: 0, moscososAntiguedad: 0, vacacionesAntiguedad: 0 });
  Object.keys(state.cuadrantePorMes).forEach(k => { const [anio, mes] = k.split("-").map(Number); state.cuadrantePorMes[k].push(Array(diasEnMes(mes, anio)).fill("")); });
  guardarDatos(); cerrarModal(); renderPersonal();
  mostrarToast(`✅ ${nombre.split(" ")[0]} añadido`);
}

function iniciarBajaWorker(id) {
  const t = state.trabajadores.find(t => t.id === id);
  if (!t) return;
  const diaInicio = prompt(`Día de inicio de la baja (1-${diasEnMes(state.mesActual, state.anio)}):`);
  if (!diaInicio) return;
  const dia = parseInt(diaInicio) - 1;
  if (isNaN(dia) || dia < 0) { mostrarToast("❌ Día inválido", true); return; }
  t.estado = "baja";
  t.fechaBaja = `${state.anio}-${String(state.mesActual+1).padStart(2,"0")}-${String(dia+1).padStart(2,"0")}`;
  const cuad = getCuadranteMes(state.mesActual, state.anio);
  const idx = state.trabajadores.indexOf(t);
  for (let d = dia; d < diasEnMes(state.mesActual, state.anio); d++) { if (cuad[idx]) cuad[idx][d] = "IT"; }
  guardarDatos(); cerrarModal(); renderPersonal(); renderCuadrante();
  mostrarToast(`✅ Baja registrada`);
}

// ==================== VISTA ZONAS ====================
function renderZonas() {
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:13px;font-weight:700">${state.zonas.length} zonas configuradas</span><button class="btn btn-primary btn-sm" onclick="modalNuevaZona()">➕ Nueva zona</button></div>`;
  for (const z of state.zonas) {
    const trabajadoresZona = state.trabajadores.filter(t => t.zonaPrincipalId === z.id);
    const rotadores = state.trabajadores.filter(t => (t.zonasRotacionIds||[]).includes(z.id) && t.zonaPrincipalId !== z.id);
    html += `<div class="zona-card" style="border-left: 4px solid ${z.color || "#e2e8f0"}"><div class="zona-card-header"><div class="zona-nombre">${z.nombre}</div><div><button class="btn btn-secondary btn-xs" onclick="modalEditarZona('${z.id}')">✏️ Editar</button><button class="btn btn-danger btn-xs" onclick="eliminarZona('${z.id}')">🗑 Eliminar</button></div></div><div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px">COBERTURA MÍNIMA REQUERIDA</div><div class="zona-turnos"><div class="zona-turno-box"><div class="zona-turno-label">🌅 MAÑANA</div><div class="zona-turno-num">${z.coberturaMin?.M ?? 0}</div></div><div class="zona-turno-box"><div class="zona-turno-label">☀️ TARDE</div><div class="zona-turno-num">${z.coberturaMin?.T ?? 0}</div></div><div class="zona-turno-box"><div class="zona-turno-label">🌙 NOCHE</div><div class="zona-turno-num">${z.coberturaMin?.N ?? 0}</div></div></div>${z.notas ? `<div class="zona-notas" style="font-size:11px;color:#64748b;margin-bottom:8px">📝 ${z.notas}</div>` : ""}<div style="margin-top:8px"><div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px">PERSONAL ASIGNADO (${trabajadoresZona.length})</div><div class="zona-workers">${trabajadoresZona.length === 0 ? '<span style="font-size:11px;color:#94a3b8">Ninguno asignado</span>' : trabajadoresZona.map(t => `<span class="badge ${t.estado==="baja"?"badge-red":"badge-green"}">${t.nombre.split(" ")[0]}</span>`).join("")}</div></div>${rotadores.length > 0 ? `<div style="margin-top:6px"><div style="font-size:11px;color:#64748b">🔄 Pueden rotar: ${rotadores.map(t => t.nombre.split(" ")[0]).join(", ")}</div></div>` : ""}</div>`;
  }
  document.getElementById("content").innerHTML = html;
}

function modalNuevaZona() { modalEditarZona(null); }
function modalEditarZona(id) {
  const z = id ? state.zonas.find(z => z.id === id) : null;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">${z ? "✏️ Editar zona" : "➕ Nueva zona"}</div><label class="modal-label">Nombre</label><input class="modal-input" id="z-nombre" value="${z?.nombre || ""}"><label class="modal-label">Cobertura mínima</label><div style="display:flex;gap:8px;margin:8px 0"><div><div style="font-size:11px;font-weight:700">🌅 MAÑANA</div><input type="number" id="z-cob-M" value="${z?.coberturaMin?.M ?? 0}" min="0" max="10" style="width:60px;padding:6px;text-align:center"></div><div><div style="font-size:11px;font-weight:700">☀️ TARDE</div><input type="number" id="z-cob-T" value="${z?.coberturaMin?.T ?? 0}" min="0" max="10" style="width:60px;padding:6px;text-align:center"></div><div><div style="font-size:11px;font-weight:700">🌙 NOCHE</div><input type="number" id="z-cob-N" value="${z?.coberturaMin?.N ?? 0}" min="0" max="10" style="width:60px;padding:6px;text-align:center"></div></div><label class="modal-label">Notas</label><textarea class="modal-input" id="z-notas" rows="2">${z?.notas || ""}</textarea><div class="modal-btns"><button class="btn-modal-ok" onclick="guardarZona('${id || ""}')">Guardar</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div></div>`;
  document.body.appendChild(overlay);
}

function guardarZona(id) {
  const nombre = document.getElementById("z-nombre")?.value?.trim();
  if (!nombre) { mostrarToast("❌ Nombre requerido", true); return; }
  const coberturaMin = { M: parseInt(document.getElementById("z-cob-M")?.value) || 0, T: parseInt(document.getElementById("z-cob-T")?.value) || 0, N: parseInt(document.getElementById("z-cob-N")?.value) || 0 };
  const notas = document.getElementById("z-notas")?.value || "";
  if (id) { const z = state.zonas.find(z => z.id === id); if (z) { z.nombre = nombre; z.coberturaMin = coberturaMin; z.notas = notas; } mostrarToast(`✅ Zona "${nombre}" actualizada`); }
  else { state.zonas.push({ id: `z_${Date.now()}`, nombre, coberturaMin, color: ZONA_COLORES[state.zonas.length % ZONA_COLORES.length], notas }); mostrarToast(`✅ Zona "${nombre}" creada`); }
  guardarDatos(); cerrarModal(); renderZonas();
}

function eliminarZona(id) {
  if (!confirm("¿Eliminar esta zona?")) return;
  state.zonas = state.zonas.filter(z => z.id !== id);
  state.trabajadores.forEach(t => { if (t.zonaPrincipalId === id) t.zonaPrincipalId = ""; t.zonasRotacionIds = (t.zonasRotacionIds || []).filter(zid => zid !== id); });
  guardarDatos(); renderZonas();
  mostrarToast("🗑 Zona eliminada");
}

// ==================== VISTA TAREAS ====================
function renderTareas() {
  let html = `<div class="card"><div class="card-header">✅ Tareas pendientes</div><div class="card-body">`;
  const pendientes = state.tareas.filter(t => !t.completada);
  if (!pendientes.length) html += `<div class="empty">Sin tareas pendientes</div>`;
  pendientes.forEach(t => {
    let badgeClass = t.prioridad === "rojo" ? "badge-red" : (t.prioridad === "amber" ? "badge-amber" : "badge-green");
    html += `<div class="tarea-item"><div class="tarea-info"><div class="tarea-nombre">${t.nombre}</div><div class="tarea-meta">📅 Día ${t.dia} · <span class="badge ${badgeClass}">${t.prioridad === "rojo" ? "Muy urgente" : t.prioridad === "amber" ? "Urgente" : "Poco urgente"}</span></div></div><div><button class="btn btn-success btn-sm" onclick="completarTarea('${t.id}')">✓</button><button class="btn btn-danger btn-sm" onclick="eliminarTarea('${t.id}')">🗑</button></div></div>`;
  });
  html += `<button class="btn btn-primary" style="margin-top:10px" onclick="modalNuevaTarea()">➕ Nueva tarea</button></div></div>`;
  document.getElementById("content").innerHTML = html;
}

function modalNuevaTarea() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-box"><div class="modal-title">➕ Nueva tarea</div><label class="modal-label">Nombre</label><input class="modal-input" id="nt-nombre"><label class="modal-label">Día del mes</label><input type="number" class="modal-input" id="nt-dia" value="1" min="1" max="31"><label class="modal-label">Prioridad</label><select class="modal-input" id="nt-prio"><option value="rojo">🔴 Muy urgente</option><option value="amber">🟡 Urgente</option><option value="verde">🟢 Poco urgente</option></select><div class="modal-btns"><button class="btn-modal-ok" onclick="crearTarea()">Añadir</button><button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button></div></div>`;
  document.body.appendChild(overlay);
}

function crearTarea() {
  const nombre = document.getElementById("nt-nombre")?.value?.trim();
  const dia = parseInt(document.getElementById("nt-dia")?.value);
  const prioridad = document.getElementById("nt-prio")?.value;
  if (!nombre || isNaN(dia)) { mostrarToast("❌ Nombre y día válidos", true); return; }
  state.tareas.push({ id: `ta_${Date.now()}`, nombre, dia, prioridad, completada: false });
  guardarDatos(); cerrarModal(); renderTareas();
  mostrarToast(`✅ Tarea añadida`);
}

function completarTarea(id) { const t = state.tareas.find(t => t.id === id); if (t) { t.completada = true; guardarDatos(); renderTareas(); mostrarToast(`✔ Tarea completada`); } }
function eliminarTarea(id) { if (confirm("¿Eliminar tarea?")) { state.tareas = state.tareas.filter(t => t.id !== id); guardarDatos(); renderTareas(); mostrarToast("🗑 Tarea eliminada"); } }

function importarCuadrante(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const datos = JSON.parse(e.target.result);
      if (!Array.isArray(datos)) throw new Error("El archivo debe ser una matriz");
      if (datos.length !== state.trabajadores.length) {
        throw new Error(`Número de filas incorrecto. Se esperaban ${state.trabajadores.length} filas (trabajadores) y el archivo tiene ${datos.length}.`);
      }
      const dias = diasEnMes(state.mesActual, state.anio);
      for (let i = 0; i < datos.length; i++) {
        if (!Array.isArray(datos[i])) throw new Error(`La fila ${i+1} no es un array válido`);
        if (datos[i].length !== dias) {
          throw new Error(`La fila ${i+1} (${state.trabajadores[i]?.nombre || '?'}) tiene ${datos[i].length} columnas. Se esperaban ${dias} (días del mes).`);
        }
      }
      const key = clavesMes(state.mesActual, state.anio);
      state.cuadrantePorMes[key] = datos;
      guardarDatos();
      mostrarToast(`✅ Cuadrante de ${MESES_NOMBRES[state.mesActual]} importado correctamente`);
      if (currentView === "cuadrante") renderCuadrante();
    } catch(err) {
      mostrarToast(`❌ Error al importar: ${err.message}`, true);
    }
  };
  reader.onerror = () => mostrarToast("❌ Error al leer el archivo", true);
  reader.readAsText(file);
  event.target.value = "";
}

// ==================== VISTA SEGURO ====================
function renderSeguro() {
  document.getElementById("content").innerHTML = `<div class="card"><div class="card-header">💾 Copia de seguridad</div><div class="card-body"><button class="btn btn-primary" onclick="exportarBackup()">⬇ Exportar backup</button><button class="btn btn-secondary" onclick="document.getElementById('file-import').click()">⬆ Importar backup</button><button class="btn btn-legal" onclick="generarPDF()">📄 Cuadrante PDF</button></div></div><div class="card"><div class="card-header">⚖️ Parámetros legales</div><div class="card-body"><button class="btn btn-legal" onclick="document.getElementById('file-import-legal').click()">📄 Importar convenio</button><div style="font-size:12px;margin-top:8px"><strong>Activos:</strong> Jornada máx ${state.parametros.jornadaMaxDiaria}h · Mín ${state.parametros.jornadaMinDiaria}h · Máx semanal ${state.parametros.jornadaMaxSemanal}h · Máx seguidos ${state.parametros.maxDiasSeguidos} · Preaviso ${state.parametros.preavisoDias} días</div><button class="btn btn-secondary" style="margin-top:10px" onclick="validarYMostrar()">🔍 Validar cuadrante</button></div></div><div class="card"><div class="card-header">🔒 Seguridad</div><div class="card-body"><button class="btn btn-secondary" onclick="mostrarPantallaPIN('setup')">${state.pinHash ? "🔑 Cambiar PIN" : "🔑 Configurar PIN"}</button>${state.pinHash ? `<button class="btn btn-danger" style="margin-top:8px" onclick="quitarPIN()">🗑 Eliminar PIN</button>` : ""}</div></div><div class="card"><div class="card-header">📋 Historial de cambios</div><div class="card-body nop">${state.historial.slice(0,20).map(h => { const t = state.trabajadores.find(w => w.id === h.trabId); return `<div class="hist-item"><strong>${t?.nombre?.split(" ")[0] || "?"}</strong> · día ${h.dia+1}/${h.mes+1}: <span style="color:#dc2626">${h.anterior||"—"}</span> → <span style="color:#16a34a">${h.nuevo||"—"}</span></div>`; }).join("") || '<div class="empty">Sin cambios registrados</div>'}</div></div>`;
}

function validarYMostrar() {
  const incidencias = validarCuadranteCompleto();
  if (!incidencias.length) { alert("✅ Sin incidencias en el cuadrante"); return; }
  alert("⚠️ INCIDENCIAS DETECTADAS:\n\n" + incidencias.join("\n"));
}

function quitarPIN() { if (confirm("¿Eliminar PIN?")) { state.pinHash = null; guardarDatos(); mostrarToast("PIN eliminado"); renderSeguro(); } }
function exportarBackup() { const a = document.createElement("a"); a.download = `cuadrante_backup_${new Date().toISOString().slice(0,10)}.json`; a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" })); a.click(); URL.revokeObjectURL(a.href); mostrarToast("✅ Backup exportado"); }
function importarBackup(event) { const file = event.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = e => { try { const data = JSON.parse(e.target.result); state = { ...state, ...data }; guardarDatos(); mostrarToast("✅ Backup importado"); render(); } catch { mostrarToast("❌ Archivo inválido", true); } }; r.readAsText(file); event.target.value = ""; }
function importarLegal(event) { const file = event.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = e => { try { const p = JSON.parse(e.target.result); state.parametros = { ...state.parametros, ...p }; guardarDatos(); mostrarToast("✅ Convenio importado"); renderSeguro(); } catch { mostrarToast("❌ Archivo inválido", true); } }; r.readAsText(file); event.target.value = ""; }

// ==================== UTILIDADES ====================
function mostrarToast(msg, isError = false) { const t = document.getElementById("toast"); t.textContent = msg; t.style.background = isError ? "#dc2626" : "#0f172a"; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function cerrarModal() { document.querySelectorAll(".modal-overlay").forEach(m => m.remove()); }

function showView(view) {
  if (state.pinHash && !pinDesbloqueado && view !== "home") { mostrarPantallaPIN("unlock"); return; }
  currentView = view;
  document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(`nav-${view}`)?.classList.add("active");
  if (view === "home") renderHome();
  else if (view === "cuadrante") renderCuadrante();
  else if (view === "personal") renderPersonal();
  else if (view === "zonas") renderZonas();
  else if (view === "tareas") renderTareas();
  else if (view === "seguro") renderSeguro();
}
function render() { showView(currentView); }

document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); undoUltimoCambio(); } });
document.addEventListener("click", e => { if (e.target.classList.contains("modal-overlay")) cerrarModal(); });

// Inicializar
cargarDatos();
document.getElementById("version-number").textContent = APP_VERSION;
if (state.pinHash) { pinDesbloqueado = false; renderHome(); mostrarPantallaPIN("unlock"); }
else { pinDesbloqueado = true; renderHome(); }
</script>
